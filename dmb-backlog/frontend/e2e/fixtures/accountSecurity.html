import {renderSecurity,initSecurity,showSetup,confirmCredentials,showOneTimeSecret} from '/js/components/accountSecurity.js';

const user={id:7,login:'ivan.petrov',permissions:{customer_portal_mode:'only'}};
window.app={api:new API(),store:{get:()=>user,set:()=>{}},auth:{},renderLoginPage(){document.getElementById('app').innerHTML='<h1>Вход</h1>';}};
