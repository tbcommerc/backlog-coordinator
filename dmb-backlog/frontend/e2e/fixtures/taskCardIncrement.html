    // In-memory writes only: this fixture never calls the backend.
    async function saveTaskFixture(payload) {
      if (window.__holdTaskWrite) {
        await new Promise(resolve => { window.__releaseTaskWrite = resolve; });
        window.__holdTaskWrite = false;
      }
      if (window.__failTaskWrite) {
        window.__failTaskWrite = false;
        throw Object.assign(new Error('Проверьте название'), {
          status: 422, data: { detail: [{ loc: ['body', 'title'], msg: 'Уточните название задачи' }] },
        });
      }
      Object.assign(task, payload, { version: task.version + 1 });
      return { ...task };
    }

      async get(path) {
        window.__apiCalls.push(['get', path]);
        if (path === '/admin/competency-costs') return competencyCosts;
        if (path === '/tasks/reference') return reference;
        if (path === '/admin/task-types') return reference.task_types;
        if (path === '/admin/channels') return reference.channels;

        if (path === '/tasks/42/comments') return { items: comments };

        if (path === '/tasks/42/attachments') return { items: attachments };
        if (path === '/tasks/42/lock') return { locked: false, is_mine: false };
        if (path === '/tasks/42/viewers') return { viewers: [] };
        if (path === '/tasks/42/reporting-statuses/context') return reportingContext;
