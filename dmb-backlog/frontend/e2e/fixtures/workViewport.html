<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Визуальная проверка рабочего списка</title>
<style>body{margin:0;background:#e9edf4;font:14px Arial;color:#25334b}header{display:flex;gap:16px;align-items:center;padding:12px;flex-wrap:wrap}select{font:inherit;padding:6px}iframe{border:0;display:block;background:white}#surface{overflow:hidden;max-width:100%}</style></head><body>
<header><label>Экран <select id="screen"><option>1440</option><option>1280</option><option>1024</option><option>768</option><option>390</option><option>320</option></select></label><label>Масштаб <select id="scale"><option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option></select></label><label>Тема <select id="theme"><option value="light">Светлая</option><option value="dark">Тёмная</option></select></label><output id="metrics"></output><span>Эмуляция zoom: CSS viewport + масштаб iframe. Демонстрационные данные.</span></header>
<div id="surface"><iframe id="app" title="Рабочие задачи"></iframe></div>
<script>
const screen=document.querySelector('#screen'),scale=document.querySelector('#scale'),app=document.querySelector('#app'),surface=document.querySelector('#surface');
function resize(){const w=Number(screen.value),s=Number(scale.value);surface.style.width=w+'px';app.style.width=(w/s)+'px';app.style.height=(840/s)+'px';app.style.zoom=s;document.querySelector('#metrics').textContent='CSS viewport: '+Math.round(w/s)+' × '+Math.round(840/s);}
app.src='workListVisual.html';
document.querySelector('#theme').onchange=e=>app.contentDocument.documentElement.dataset.theme=e.target.value;
screen.onchange=scale.onchange=resize;resize();
</script></body></html>
