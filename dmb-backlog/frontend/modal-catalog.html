<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Каталог модальных окон · Backlog coordinator</title>
  <link rel="stylesheet" href="./css/fonts.css">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/components.css?v=132">
  <link rel="stylesheet" href="./css/pages.css?v=87">
  <link rel="stylesheet" href="./css/responsive.css?v=22">
  <link rel="stylesheet" href="./css/did-backlog.css?v=5">
  <link rel="stylesheet" href="./css/feedback.css?v=5">
  <link rel="stylesheet" href="./css/modal-system.css">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { min-width: 320px; min-height: 100vh; margin: 0; background: var(--bg-secondary); color: var(--text-primary); }
    .catalog-top { position: sticky; top: 0; z-index: 30; border-bottom: 1px solid var(--border-color); background: color-mix(in srgb, var(--bg-primary) 94%, transparent); backdrop-filter: blur(16px); }
    .catalog-top__inner { width: min(1480px, calc(100% - 40px)); margin: auto; padding: 18px 0 14px; }
    .catalog-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; }
    .catalog-kicker { margin-bottom: 4px; color: var(--accent); font-size: 11px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
    .catalog-title-row h1 { margin: 0; font-size: clamp(22px, 2.4vw, 32px); line-height: 1.15; }
    .catalog-title-row p { max-width: 780px; margin: 7px 0 0; color: var(--text-secondary); font-size: 13px; line-height: 1.5; }
    .catalog-toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    .catalog-toolbar button { min-height: 36px; border: 1px solid var(--border-color); border-radius: 9px; background: var(--bg-primary); color: var(--text-secondary); padding: 7px 11px; cursor: pointer; font: inherit; font-size: 12px; font-weight: 650; }
    .catalog-toolbar button:hover { border-color: var(--border-hover); color: var(--text-primary); }
    .catalog-toolbar button[aria-pressed="true"] { border-color: color-mix(in srgb, var(--accent) 54%, var(--border-color)); background: color-mix(in srgb, var(--accent) 9%, var(--bg-primary)); color: var(--accent); }
    .catalog-count { margin-left: auto; color: var(--text-muted); font-size: 12px; }
    .catalog-main { width: min(1480px, calc(100% - 40px)); margin: 0 auto; padding: 28px 0 72px; }
    .catalog-section { scroll-margin-top: 150px; margin-top: 34px; }
    .catalog-section:first-child { margin-top: 0; }
    .catalog-section__head { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; margin: 0 0 13px; }
    .catalog-section__head h2 { margin: 0; font-size: 18px; }
    .catalog-section__head span { color: var(--text-muted); font-size: 12px; }
    .catalog-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; align-items: stretch; }
    .catalog-item { min-width: 0; overflow: hidden; border: 1px solid var(--border-color); border-radius: 16px; background: var(--bg-primary); box-shadow: var(--shadow-sm); }
    .catalog-item[data-wide="true"] { grid-column: 1 / -1; }
    .catalog-item[hidden] { display: none; }
    .catalog-item__meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; padding: 10px 14px; border-bottom: 1px solid var(--border-color); background: var(--bg-primary); }
    .catalog-item__name { min-width: 0; }
    .catalog-item__name strong { display: block; font-size: 13px; }
    .catalog-item__name span { display: block; margin-top: 2px; color: var(--text-muted); font-size: 10px; }
    .catalog-item__tags { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
    .catalog-tag { padding: 3px 7px; border-radius: 999px; background: var(--bg-tertiary); color: var(--text-secondary); font-size: 9px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; }
    .catalog-stage { position: relative; min-width: 0; min-height: 430px; overflow: hidden; background: #8d95a3; }
    .catalog-item[data-tall="true"] .catalog-stage { min-height: 590px; }
    .catalog-item[data-wide="true"] .catalog-stage { min-height: 520px; }
    .catalog-stage > :is(.modal-overlay,.admin-modal-overlay,.feedback-confirm-overlay,.conflict-overlay,.modal-backdrop) { position: absolute !important; inset: 0 !important; z-index: 1 !important; width: 100%; height: 100%; min-height: 100%; }
    .catalog-stage > dialog.customer-reference-dialog { position: absolute !important; inset: 18px !important; width: min(760px, calc(100% - 36px)); max-height: calc(100% - 36px); margin: auto; }
    .catalog-stage :is(.modal-body,.app-modal__body,.modal-body-scroll) { scrollbar-width: thin; }
    .catalog-stage .modal-body { max-height: 350px; }
    .catalog-stage .app-modal__body { max-height: 390px; }
    .catalog-stage .modal-body-scroll { max-height: 400px; }
    .catalog-stage .catalog-form { display: grid; gap: 14px; }
    .catalog-stage .catalog-form label { display: grid; gap: 6px; font-size: 12px; font-weight: 650; }
    .catalog-stage .catalog-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .catalog-stage .catalog-notice { padding: 11px 12px; border: 1px solid var(--border-color); border-radius: 9px; background: var(--bg-tertiary); color: var(--text-secondary); font-size: 12px; line-height: 1.45; }
    .catalog-stage .catalog-warning { border-color: color-mix(in srgb, var(--warning) 40%, var(--border-color)); background: color-mix(in srgb, var(--warning) 9%, var(--bg-primary)); }
    .catalog-stage .catalog-danger { border-color: color-mix(in srgb, var(--danger) 40%, var(--border-color)); background: color-mix(in srgb, var(--danger) 8%, var(--bg-primary)); }
    .catalog-stage .catalog-list { display: grid; gap: 7px; }
    .catalog-stage .catalog-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-primary); font-size: 12px; }
    .catalog-stage .catalog-row > div { min-width: 0; }
    .catalog-stage .catalog-row strong, .catalog-stage .catalog-row span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .catalog-stage .catalog-row span { margin-top: 2px; color: var(--text-muted); font-size: 10px; }
    .catalog-stage .catalog-summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .catalog-stage .catalog-summary > div { padding: 12px; border-radius: 9px; background: var(--bg-tertiary); }
    .catalog-stage .catalog-summary span { display: block; color: var(--text-muted); font-size: 10px; }
    .catalog-stage .catalog-summary strong { display: block; margin-top: 4px; font-size: 20px; }
    .catalog-stage .catalog-table { width: 100%; border-collapse: collapse; font-size: 11px; }
    .catalog-stage .catalog-table th, .catalog-stage .catalog-table td { padding: 8px; border-bottom: 1px solid var(--border-color); text-align: left; }
    .catalog-stage .catalog-table th { position: sticky; top: 0; background: var(--bg-tertiary); color: var(--text-muted); font-size: 9px; text-transform: uppercase; }
    .catalog-stage .catalog-table-wrap { max-height: 190px; overflow: auto; border: 1px solid var(--border-color); border-radius: 8px; }
    .catalog-stage .catalog-check { display: flex; align-items: flex-start; gap: 9px; padding: 11px; border: 1px solid var(--border-color); border-radius: 9px; font-size: 12px; line-height: 1.45; }
    .catalog-stage .catalog-check input { margin-top: 2px; }
    .catalog-stage .create-duplicate-list { max-height: 170px; overflow: auto; }
    .catalog-stage .create-duplicate-item { text-decoration: none; }
    .catalog-stage .meeting-dialog-warning { margin-bottom: 0; }
    .catalog-stage .meeting-planner-list { display: grid; gap: 8px; }
    .catalog-stage .meeting-planner-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; }
    .catalog-stage .meeting-planner-row small { display: block; color: var(--text-muted); }
    .catalog-stage .review-modal-consequence { margin-bottom: 0; }
    .catalog-stage .chat-submit-facts { margin: 12px 0; }
    .catalog-stage .qe-complete-details { margin-bottom: 0; }
    .catalog-stage #task-detail-overlay, .catalog-stage #create-task-overlay { position: absolute; inset: 0; z-index: 1; height: 100%; min-height: 100%; }
    .catalog-stage #task-detail-overlay .modal, .catalog-stage #create-task-overlay .modal { width: calc(100% - 24px); max-width: 1280px; max-height: calc(100% - 24px); }
    .catalog-stage #task-detail-overlay .mbody, .catalog-stage #create-task-overlay .mbody { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 12px; padding: 18px; overflow: auto; }
    .catalog-stage #task-detail-overlay .task-title-card, .catalog-stage #create-task-overlay .task-title-card { grid-column: 1 / -1; }
    .catalog-stage #task-detail-overlay .field, .catalog-stage #create-task-overlay .field { min-height: 82px; padding: 12px; }
    .catalog-stage .mfoot { min-height: 58px; }
    .catalog-mobile .catalog-grid { grid-template-columns: minmax(0, 430px); justify-content: center; }
    .catalog-mobile .catalog-item[data-wide="true"] { grid-column: auto; }
    .catalog-mobile .catalog-stage { min-height: 620px; }
    .catalog-mobile .catalog-item[data-tall="true"] .catalog-stage { min-height: 720px; }
    .catalog-mobile .catalog-stage > :is(.modal-overlay,.admin-modal-overlay,.feedback-confirm-overlay,.conflict-overlay,.modal-backdrop) { padding: 8px !important; }
    .catalog-mobile .catalog-stage :is(.modal,.admin-modal,.feedback-confirm,.conflict-modal,.app-modal) { width: 100% !important; max-width: 100% !important; max-height: calc(100% - 16px) !important; border-radius: 12px !important; }
    .catalog-mobile .catalog-stage :is(.modal-header,.app-modal__header,.feedback-confirm-header) { padding: 16px 16px 14px !important; }
    .catalog-mobile .catalog-stage :is(.modal-body,.app-modal__body,.feedback-confirm-body) { padding: 16px !important; }
    .catalog-mobile .catalog-stage :is(.modal-footer,.modal-footer-sticky,.app-modal__footer,.feedback-confirm-actions) { padding: 14px 16px !important; align-items: stretch; flex-direction: column-reverse; }
    .catalog-mobile .catalog-stage :is(.modal-footer,.modal-footer-sticky,.app-modal__footer,.feedback-confirm-actions) .btn { width: 100%; justify-content: center; }
    .catalog-mobile .catalog-stage :is(.modal-close,.modal-close-x,.prioritiser-requirements-x) { flex-basis: 44px !important; width: 44px !important; min-width: 44px !important; height: 44px !important; min-height: 44px !important; }
    .catalog-mobile .catalog-stage #task-detail-overlay .mbody, .catalog-mobile .catalog-stage #create-task-overlay .mbody { grid-template-columns: 1fr; }
    .catalog-mobile .catalog-stage #task-detail-overlay .task-title-card, .catalog-mobile .catalog-stage #create-task-overlay .task-title-card { grid-column: auto; }
    @media (max-width: 820px) {
      .catalog-top__inner, .catalog-main { width: min(100% - 24px, 680px); }
      .catalog-title-row { display: block; }
      .catalog-count { width: 100%; margin-left: 0; }
      .catalog-grid { grid-template-columns: 1fr; }
      .catalog-item[data-wide="true"] { grid-column: auto; }
      .catalog-stage { min-height: 600px; }
      .catalog-stage .catalog-columns { grid-template-columns: 1fr; }
      .catalog-stage #task-detail-overlay .mbody, .catalog-stage #create-task-overlay .mbody { grid-template-columns: 1fr; }
    }
  </style>
  <link rel="stylesheet" href="./css/ui/kit.css?v=16">
</head>
<body>
  <header class="catalog-top">
    <div class="catalog-top__inner">
      <div class="catalog-title-row">
        <div>
          <div class="catalog-kicker">Визуальная инвентаризация · 07.09.2026</div>
          <h1>Все модальные окна системы</h1>
          <p>35 реальных сценариев из Backlog coordinator. Каталог использует рабочие стили приложения; данные внутри примеров демонстрационные и не отправляются в API.</p>
        </div>
      </div>
      <nav class="catalog-toolbar" aria-label="Фильтры каталога">
        <button type="button" data-filter="all" aria-pressed="true">Все</button>
        <button type="button" data-filter="confirm">Подтверждения</button>
        <button type="button" data-filter="workflow">Рабочие формы</button>
        <button type="button" data-filter="operation">Операции</button>
        <button type="button" data-filter="admin">Администрирование</button>
        <button type="button" data-filter="task">Задачи</button>
        <button type="button" id="catalog-width" aria-pressed="false">Мобильная ширина</button>
        <button type="button" id="catalog-theme" aria-pressed="false">Тёмная тема</button>
        <span class="catalog-count" id="catalog-count" aria-live="polite"></span>
      </nav>
    </div>
  </header>
  <main class="catalog-main" id="catalog"></main>
  <script>
    const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
    const closeButton = '<button type="button" class="modal-close" aria-label="Закрыть">×</button>';
    const action = (text, kind = 'secondary', attrs = '') => `<button type="button" class="btn btn-${kind} btn-sm" ${attrs}>${text}</button>`;
    const formField = (label, control, hint = '') => `<label>${label}${control}${hint ? `<small style="color:var(--text-muted);font-weight:400">${hint}</small>` : ''}</label>`;
    const input = (value = '', type = 'text') => `<input class="input" type="${type}" value="${esc(value)}">`;
    const select = value => `<select class="input"><option>${esc(value)}</option><option>Другой вариант</option></select>`;
    const textarea = (value = '', rows = 3) => `<textarea class="input" rows="${rows}">${esc(value)}</textarea>`;

    function standard({ id, title, subtitle = '', body, actions, size = '', close = true, alert = false, extra = '' }) {
      return `<div class="modal-overlay"><div class="modal ${size} ${extra}" role="${alert ? 'alertdialog' : 'dialog'}" aria-modal="true" aria-labelledby="${id}-title">
        <div class="modal-header"><div><h3 class="modal-title" id="${id}-title">${title}</h3>${subtitle ? `<p class="app-modal__subtitle">${subtitle}</p>` : ''}</div>${close ? closeButton : ''}</div>
        <div class="modal-body">${body}</div>${actions ? `<div class="modal-footer">${actions}</div>` : ''}</div></div>`;
    }
    function appModal({ id, title, subtitle = '', body, actions, size = 'app-modal--small', close = false, alert = false, extra = '' }) {
      return `<div class="modal-overlay"><div class="app-modal ${size} ${extra}" role="${alert ? 'alertdialog' : 'dialog'}" aria-modal="true" aria-labelledby="${id}-title">
        <div class="app-modal__header"><div><h3 class="app-modal__title" id="${id}-title">${title}</h3>${subtitle ? `<p class="app-modal__subtitle">${subtitle}</p>` : ''}</div>${close ? closeButton : ''}</div>
        <div class="app-modal__body">${body}</div><div class="app-modal__footer">${actions}</div></div></div>`;
    }
    function adminModal({ id, title, body, actions, size = 'app-modal--medium' }) {
      return `<div class="admin-modal-overlay"><div class="admin-modal ${size}" role="dialog" aria-modal="true" aria-labelledby="${id}-title">
        <div class="modal-header-sticky"><div><h3 class="modal-title" id="${id}-title">${title}</h3><button class="modal-close-x" aria-label="Закрыть">×</button></div></div>
        <div class="modal-body-scroll"><div class="catalog-form">${body}</div></div><div class="modal-footer-sticky"><div>${actions}</div></div></div></div>`;
    }
    function rows(items) { return `<div class="catalog-list">${items.map(([a,b,c]) => `<div class="catalog-row"><div><strong>${a}</strong><span>${b}</span></div>${c || ''}</div>`).join('')}</div>`; }
    function taskShell(create = false) {
      const id = create ? 'create-task-overlay' : 'task-detail-overlay';
      return `<div class="modal-overlay" id="${id}"><div class="task-detail-modal modal" role="dialog" aria-modal="true">
        <div class="mhead"><div class="head-row1"><div class="row-badges"><span class="task-head-chip task-head-chip--type">${create ? 'Новая задача' : 'TASK-000-250'}</span>${create ? '<span class="header-unsaved-indicator">Не сохранено</span>' : '<span class="task-head-chip task-head-chip--status">В работе</span>'}</div><div class="row-actions">${create ? '' : '<button class="iconbtn" aria-label="Копировать ссылку">↗</button>'}<button class="iconbtn close" aria-label="Закрыть">×</button></div></div><h2 class="head-title">${create ? 'Создание новой задачи' : 'Интеграция расчёта приоритета в карточку задачи'}</h2></div>
        ${create ? '' : '<div class="tabs"><button class="tab on">Основное</button><button class="tab">Оценка</button><button class="tab">Комментарии</button><span id="tabInd"></span></div>'}
        <div class="mbody"><div class="task-title-card"><strong>${create ? 'Название *' : 'Краткое описание'}</strong><p>${create ? 'Введите название задачи и заполните обязательные поля.' : 'Текущая workspace-композиция карточки сохранена.'}</p></div><div class="field"><span class="flabel">${create ? 'Ответственная команда *' : 'Статус'}</span><strong>${create ? 'Core Platform' : 'В работе'}</strong></div><div class="field"><span class="flabel">${create ? 'Тип задачи *' : 'Команда'}</span><strong>${create ? 'Разработка' : 'Core Platform'}</strong></div><div class="field"><span class="flabel">${create ? 'Канал поступления *' : 'Приоритет'}</span><strong>${create ? 'Бэклог' : 'P2'}</strong></div></div>
        <div class="mfoot"><div class="fmeta">${create ? '<b>*</b> Обязательные поля' : 'Версия 12 · сохранено'}</div><div class="factions"><button class="btn ghost">${create ? 'Очистить форму' : 'Закрыть'}</button>${create ? '<button class="btn ghost">Отмена</button><button class="btn primary">Создать задачу</button>' : '<button class="btn primary">Редактировать</button>'}</div></div>
      </div></div>`;
    }

    const scenarios = [
      { id:'confirm-standard', group:'confirm', name:'Обычное подтверждение', source:'modal.js · showConfirmModal / uiFeedback.js · confirmAction', html:appModal({id:'confirm-standard',title:'Сохранить изменения?',body:'<p class="app-modal__subtitle">Изменения будут применены к выбранной задаче.</p>',actions:action('Отмена')+action('Сохранить','primary'),alert:true}) },
      { id:'confirm-danger', group:'confirm', name:'Опасное подтверждение', source:'uiFeedback.js · confirmAction(destructive)', html:appModal({id:'confirm-danger',title:'Отклонить задачу?',body:'<p class="app-modal__subtitle">Задача будет переведена в отклонённые. Продолжить?</p>',actions:action('Отмена')+action('Отклонить','danger'),alert:true}) },
      { id:'confirm-admin', group:'confirm', name:'Подтверждение администратора', source:'admin.js · showConfirmModal', html:standard({id:'confirm-admin',title:'Подтверждение действия',close:false,alert:true,body:'<div style="width:48px;height:48px;border-radius:50%;background:var(--danger-light);display:grid;place-items:center;margin:0 auto 16px;color:var(--danger);font-size:22px">!</div><p style="margin:0;text-align:center">Значение используется в 12 связанных записях. Архивировать его?</p>',actions:action('Отмена','ghost')+action('Архивировать','danger'),size:'modal-sm'}) },
      { id:'unsaved-task', group:'confirm', name:'Выход из редактирования задачи', source:'modal.js · showEditExitModal', wide:true, html:appModal({id:'unsaved-task',title:'Отменить изменения?',size:'app-modal--medium',body:'<p class="app-modal__subtitle">Все несохранённые изменения будут потеряны. Это действие нельзя отменить.</p>',actions:action('Продолжить редактирование')+action('Сохранить изменения','primary')+action('Отменить изменения','danger'),alert:true}) },
      { id:'unsaved-quick', group:'confirm', name:'Выход из быстрого редактирования', source:'quickEdit.js · showQuickEditExitModal', wide:true, html:standard({id:'unsaved-quick',title:'Несохранённые изменения',close:false,alert:true,size:'modal-md',body:'<p class="app-modal__subtitle">В режиме быстрого редактирования есть несохранённые изменения. Что сделать перед выходом?</p>',actions:action('Продолжить редактирование')+action('Выйти без сохранения')+action('Сохранить и выйти','primary')}) },
      { id:'duplicate', group:'confirm', name:'Предупреждение о дубликатах', source:'modal.js · showCreateDuplicateWarning', wide:true, html:appModal({id:'duplicate',title:'Возможные дубликаты',size:'app-modal--medium create-duplicate-dialog',body:'<p>Найдены задачи с похожими названиями. Проверьте их перед созданием новой.</p>'+rows([['TASK-000-214','Интеграция расчёта приоритета'],['TASK-000-233','Расчёт финансового эффекта агентом'],['TASK-000-248','Приоритизация задач бэклога']]),actions:action('Вернуться к названию')+action('Всё равно создать','primary'),alert:true}) },

      { id:'meeting-schedule', group:'workflow', name:'Назначение даты встречи', source:'reports.js · showReportingMeetingForm(schedule)', html:standard({id:'meeting-schedule',title:'Назначить дату встречи',subtitle:'Статус для ключевых проектов',extra:'meeting-management-dialog',body:`<div class="catalog-form">${formField('Дата встречи *',input('2026-09-15','date'))}${formField('Комментарий',textarea('Подготовить актуальный статус и риски.'))}</div>`,actions:action('Закрыть')+action('Сохранить дату','primary')}) },
      { id:'meeting-cancel', group:'workflow', name:'Отмена встречи', source:'reports.js · showReportingMeetingForm(cancel)', html:standard({id:'meeting-cancel',title:'Отменить встречу',subtitle:'Директорская оперативка',extra:'meeting-management-dialog',body:`<div class="catalog-form"><div class="meeting-dialog-warning">Встреча будет отменена. Заполненные статусы перенесутся в следующую встречу.</div>${formField('Причина отмены *',textarea('Перенос из-за изменения состава участников.'))}</div>`,actions:action('Закрыть')+action('Отменить встречу','danger')}) },
      { id:'meeting-complete', group:'workflow', name:'Завершение встречи', source:'reports.js · showReportingMeetingForm(complete)', html:standard({id:'meeting-complete',title:'Встреча состоялась',subtitle:'Оперативка ДИД',extra:'meeting-management-dialog',body:'<div class="meeting-dialog-warning is-success">Текущие отчётные статусы будут зафиксированы. Заполнено 18 из 21 задачи.</div>',actions:action('Закрыть')+action('Подтвердить','primary')}) },

      { id:'task-detail', group:'task', name:'Карточка задачи', source:'modal.js · renderTaskDetailModal', wide:true, tall:true, html:taskShell(false) },

    const groupNames = { confirm:'Подтверждения и выход', workflow:'Рабочие формы', operation:'Массовые операции и расчёты', admin:'Администрирование', task:'Карточка и создание задачи' };
    const groupOrder = ['confirm','workflow','operation','admin','task'];
    const catalog = document.getElementById('catalog');
    function renderCatalog() {
      catalog.innerHTML = groupOrder.map(group => {
        const items = scenarios.filter(item => item.group === group);
        return `<section class="catalog-section" data-section="${group}"><div class="catalog-section__head"><h2>${groupNames[group]}</h2><span>${items.length} сценариев</span></div><div class="catalog-grid">${items.map(item => `<article class="catalog-item" data-modal-scenario="${item.id}" data-group="${group}" data-wide="${Boolean(item.wide)}" data-tall="${Boolean(item.tall)}"><header class="catalog-item__meta"><div class="catalog-item__name"><strong>${item.name}</strong><span>${item.source}</span></div><div class="catalog-item__tags"><span class="catalog-tag">${group}</span>${item.wide ? '<span class="catalog-tag">wide</span>' : ''}</div></header><div class="catalog-stage">${item.html}</div></article>`).join('')}</div></section>`;
      }).join('');
      document.getElementById('catalog-count').textContent = `${scenarios.length} из ${scenarios.length} сценариев`;
      document.documentElement.dataset.ready = 'true';
    }
    renderCatalog();
    document.querySelectorAll('[data-filter]').forEach(button => button.addEventListener('click', () => {
      const filter = button.dataset.filter;
      document.querySelectorAll('[data-filter]').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
      document.querySelectorAll('[data-modal-scenario]').forEach(item => { item.hidden = filter !== 'all' && item.dataset.group !== filter; });
      document.querySelectorAll('[data-section]').forEach(section => { section.hidden = filter !== 'all' && section.dataset.section !== filter; });
      const count = scenarios.filter(item => filter === 'all' || item.group === filter).length;
      document.getElementById('catalog-count').textContent = `${count} из ${scenarios.length} сценариев`;
    }));
    document.getElementById('catalog-width').addEventListener('click', event => {
      const active = document.body.classList.toggle('catalog-mobile');
      event.currentTarget.setAttribute('aria-pressed', String(active));
      event.currentTarget.textContent = active ? 'Ширина desktop' : 'Мобильная ширина';
    });
    document.getElementById('catalog-theme').addEventListener('click', event => {
      const dark = document.documentElement.dataset.theme !== 'dark';
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      event.currentTarget.setAttribute('aria-pressed', String(dark));
      event.currentTarget.textContent = dark ? 'Светлая тема' : 'Тёмная тема';
    });
    document.addEventListener('click', event => { if (event.target.closest('.catalog-stage button, .catalog-stage a')) event.preventDefault(); });
