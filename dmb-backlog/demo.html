    --bp-sm: 640px;

    --bp-xl: 1280px;
}


[data-accent="indigo"] { --accent: #6366f1; --accent-hover: #5558e8; --accent-light: rgba(99,102,241,0.12); }
[data-accent="emerald"] { --accent: #10b981; --accent-hover: #059669; --accent-light: rgba(16,185,129,0.12); }

[data-accent="violet"] { --accent: #8b5cf6; --accent-hover: #7c3aed; --accent-light: rgba(139,92,246,0.12); }

[data-compact="true"] {
    --space-4: 0.75rem;
    --space-6: 1rem;
    --space-8: 1.5rem;
    --text-sm: 0.8125rem;
    --navbar-height: 48px;
}

    --bg-secondary: #ffffff;
    --bg-tertiary: #f1f5f9;
    --bg-elevated: #ffffff;
    --border-color: #e2e8f0;

*, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow: auto scroll;
}

body {
    font-family: var(--font-family);
    font-size: var(--text-sm);
    line-height: var(--line-height-normal);
    color: var(--text-primary);
    background-color: var(--bg-primary);
    overflow: visible;
}

a {
    color: var(--text-link);
    text-decoration: none;
    transition: color var(--transition-fast);
}

a:hover {
    color: var(--accent-hover);
}

img, svg {
    display: block;
    max-width: 100%;
}

button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    background: none;
    color: inherit;
}

input, select, textarea {
    font-family: inherit;
    font-size: inherit;
    color: inherit;
}

ul, ol {
    list-style: none;
}


::-webkit-scrollbar {
    width: 8px;
    height: 8px;
}

::-webkit-scrollbar-track {
    background: var(--bg-primary);
}

::-webkit-scrollbar-thumb {
    background: var(--border-color);
    border-radius: var(--radius-full);
}

::-webkit-scrollbar-thumb:hover {
    background: var(--border-hover);
}


h1, h2, h3, h4, h5, h6 {
    font-weight: var(--font-semibold);
    line-height: var(--line-height-tight);
    color: var(--text-primary);
}

h1 { font-size: var(--text-2xl); }
h2 { font-size: var(--text-2xl); }
h3 { font-size: var(--text-xl); }
h4 { font-size: var(--text-lg); }
h5 { font-size: var(--text-base); }
h6 { font-size: var(--text-sm); }

p { color: var(--text-secondary); }


.text-center { text-align: center; }
.text-right { text-align: right; }
.text-left { text-align: left; }

.text-primary { color: var(--text-primary); }
.text-secondary { color: var(--text-secondary); }
.text-muted { color: var(--text-muted); }
.text-accent { color: var(--accent); }
.text-success { color: var(--success); }
.text-warning { color: var(--warning); }
.text-danger { color: var(--danger); }

.font-mono { font-family: var(--font-mono); }
.font-medium { font-weight: var(--font-medium); }
.font-semibold { font-weight: var(--font-semibold); }
.font-bold { font-weight: var(--font-bold); }

.flex { display: flex; }
.flex-col { flex-direction: column; }
.flex-row { flex-direction: row; }
.flex-wrap { flex-wrap: wrap; }
.items-center { align-items: center; }
.items-start { align-items: flex-start; }
.justify-center { justify-content: center; }
.justify-between { justify-content: space-between; }
.justify-end { justify-content: flex-end; }
.gap-1 { gap: var(--space-1); }
.gap-2 { gap: var(--space-2); }
.gap-3 { gap: var(--space-3); }
.gap-4 { gap: var(--space-4); }
.gap-6 { gap: var(--space-6); }

.w-full { width: 100%; }
.h-full { height: 100%; }

.hidden { display: none !important; }
.visible { display: block; }

.truncate {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.flex-1 { flex: 1; }
.flex-shrink-0 { flex-shrink: 0; }
.shrink-0 { flex-shrink: 0; }
.min-w-0 { min-width: 0; }

.border { border: 1px solid var(--border-color); }
.border-main { border-color: var(--border-color); }
.border-t { border-top: 1px solid var(--border-color); }

.relative { position: relative; }
.absolute { position: absolute; }
.block { display: block; }

.text-sm { font-size: var(--text-sm); }
.text-xs { font-size: var(--text-xs); }
.text-main { color: var(--text-primary); }
.text-sub { color: var(--text-secondary); }

.rounded-lg { border-radius: var(--radius-lg); }
.rounded-full { border-radius: var(--radius-full); }
.rounded-xl { border-radius: var(--radius-xl); }

.p-0 { padding: 0; }
.p-1 { padding: var(--space-1); }
.p-2 { padding: var(--space-2); }
.p-3 { padding: var(--space-3); }
.p-4 { padding: var(--space-4); }
.px-3 { padding-left: var(--space-3); padding-right: var(--space-3); }
.py-1 { padding-top: var(--space-1); padding-bottom: var(--space-1); }
.py-2 { padding-top: var(--space-2); padding-bottom: var(--space-2); }
.pb-0 { padding-bottom: 0; }

.m-0 { margin: 0; }
.mb-0 { margin-bottom: 0; }
.mb-1 { margin-bottom: var(--space-1); }
.mb-2 { margin-bottom: var(--space-2); }
.mb-4 { margin-bottom: var(--space-4); }
.mt-1 { margin-top: var(--space-1); }
.mt-2 { margin-top: var(--space-2); }

.cursor-pointer { cursor: pointer; }
.select-none { user-select: none; }
.overflow-hidden { overflow: hidden; }

.hover\:bg-hover:hover { background: var(--bg-hover); }


:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
}

button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
}

.input:focus-visible {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-light);
}


@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
    }
}


@media (prefers-color-scheme: light) {
    :root:not([data-theme]) {
        --bg-primary: #f8fafc;
        --bg-secondary: #ffffff;
        --bg-tertiary: #f1f5f9;
        --bg-elevated: #ffffff;
        --border-color: #e2e8f0;
        --border-hover: #cbd5e1;
        --text-primary: #1e293b;
        --text-secondary: #64748b;
        --text-muted: #94a3b8;
    }
}


@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}

@keyframes slideDown {
    from { transform: translateY(-10px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}

@keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

.animate-fade-in { animation: fadeIn var(--transition-normal) ease; }
.animate-slide-up { animation: slideUp var(--transition-slow) ease; }
.animate-slide-down { animation: slideDown var(--transition-normal) ease; }
.animate-spin { animation: spin 1s linear infinite; }


.skip-link:focus {
    top: 0;
}


#app {
    min-height: 100vh;
    display: flex;
    overflow-x: visible;
}

.main-wrapper {
    flex: 1;
    margin-left: var(--sidebar-width);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    transition: margin-left 0.3s ease;
    background: var(--bg-primary);
    min-width: 0;
}

.sidebar.collapsed ~ .main-wrapper {
    margin-left: var(--sidebar-collapsed-width);
}

.main-content {
    flex: 1;
    padding: var(--space-8);
    background: var(--bg-primary);
    min-width: 0;
}

.page-header {
    margin-bottom: var(--space-6);
}

.page-header h1 {
    margin-bottom: var(--space-1);
}

.page-header p {
    color: var(--text-secondary);
    font-size: var(--text-sm);
}


.grid-2 {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: var(--space-6);
}

.grid-3 {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--space-6);
}

.grid-4 {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: var(--space-6);
}

.sidebar-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: calc(var(--z-fixed) - 1);
}

@media (max-width: 1024px) {
    .grid-4 { grid-template-columns: repeat(2, 1fr); }
    .grid-3 { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 768px) {
    .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; }

    
    .sidebar {
        transform: translateX(-100%);
        transition: transform 0.3s ease, width 0.3s ease;
    }
    .sidebar.open {
        transform: translateX(0);
    }
    .sidebar.open ~ .sidebar-backdrop {
        display: block;
    }

    .main-wrapper {
        margin-left: 0;
    }
    .main-content {
        padding: var(--space-4);
    }

    
    .navbar {
        padding: 0 var(--space-4) !important;
    }
    .navbar .search-wrap {
        display: none;
    }
}

@media (max-width: 480px) {
    .main-content {
        padding: var(--space-3);
    }
    .navbar {
        padding: 0 var(--space-3) !important;
        gap: var(--space-2);
    }
    .navbar .navbar-right {
        gap: 2px;
    }
}



.sticky-toolbar {
  position: sticky;
  top: var(--navbar-height);
  z-index: 25;
  margin-bottom: var(--space-6);
  background: var(--bg-primary);
}

.sticky-toolbar-inner {
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 12px;
}

.toolbar-title-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.toolbar-title-wrap {
  flex: 1;
  min-width: 0;
}

.toolbar-title {
  font-size: var(--text-2xl);
  margin: 0;
  padding: 0;
}

.toolbar-subtitle {
  font-size: var(--text-xs);
  color: var(--text-secondary);
  margin: 2px 0 0 0;
  padding: 0;
}

.toolbar-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.toolbar-actions:only-child {
  margin-bottom: 0;
}

.filter-panel {
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 10px;
  padding: 8px 12px;
}

.filter-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 500;
  background: var(--bg-input);
  color: var(--text-secondary);
  border: 1px solid var(--border-color);
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
  overflow: hidden;
}

.filter-btn:hover {
  background: var(--bg-hover);
  border-color: color-mix(in srgb, var(--accent) 40%, var(--border-color));
}

.filter-btn.has-value {
  background: color-mix(in srgb, var(--accent) 10%, transparent);
  color: var(--accent);
  border-color: color-mix(in srgb, var(--accent) 40%, transparent);
  font-weight: 600;
}

.filter-btn .filter-label {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--text-muted);
  font-weight: 500;
  font-size: 11px;
}

.filter-btn.has-value .filter-label {
  color: var(--accent);
  opacity: 0.85;
}

.filter-btn .filter-value {
  min-width: 0;
  max-width: 100px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  text-align: left;
}

.filter-btn .filter-icon {
  flex-shrink: 0;
  width: 12px;
  height: 12px;
}

.filter-btn .filter-chevron {
  margin-left: auto;
  opacity: 0.5;
  flex-shrink: 0;
}

.filter-dropdown {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  min-width: 220px;
  max-height: 340px;
  overflow-y: auto;
  z-index: 40;
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 10px;
  box-shadow: 0 10px 25px -5px var(--shadow-color), 0 8px 10px -6px var(--shadow-color);
  padding: 8px;
}

.filter-dropdown .fd-search {
  width: 100%;
  padding: 6px 10px;
  font-size: 12px;
  background: var(--bg-input);
  border: 1px solid var(--border-color);
  border-radius: 6px;
  margin-bottom: 6px;
  color: var(--text-primary);
  box-sizing: border-box;
}

.filter-dropdown .fd-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  color: var(--text-secondary);
  transition: background-color 0.1s;
}

.filter-dropdown .fd-item:hover {
  background: var(--bg-hover);
}

.filter-ext-row {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 8px;
}

.filter-cell {
  position: relative;
  display: flex;
  align-items: stretch;
  flex: 1;
  min-width: 0;
}

.filter-cell .filter-btn {
  min-height: 32px;
  width: 100%;
  min-width: 0;
}


.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-2);
    padding: 10px 20px;
    border-radius: var(--radius-md);
    font-weight: var(--font-medium);
    font-size: var(--text-sm);
    transition: all var(--transition-fast);
    white-space: nowrap;
    user-select: none;
}

.btn-primary {
    background: var(--accent);
    color: white;
}
.btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }
.btn-primary:active { transform: translateY(0); }

.btn-secondary {
    background: transparent;
    color: var(--text-secondary);
    border: 1px solid var(--border-color);
}
.btn-secondary:hover { 
    background: var(--bg-hover);
    border-color: var(--border-hover);
    color: var(--text-primary);
}

.btn-ghost {
    background: transparent;
    color: var(--text-secondary);
    padding: 8px 12px;
}
.btn-ghost:hover { background: var(--bg-hover); color: var(--text-primary); }

.btn-danger {
    background: var(--danger);
    color: white;
}
.btn-danger:hover { background: #dc2626; }

.btn-success {
    background: var(--success);
    color: white;
}
.btn-success:hover { background: #059669; }

.btn-sm { padding: 6px 12px; font-size: var(--text-xs); }
.btn-lg { padding: 14px 28px; font-size: var(--text-base); }
.btn-icon { padding: 8px; border-radius: var(--radius-md); }
.btn-icon svg { width: 18px; height: 18px; }

.btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none !important;
}


.card {
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: var(--space-6);
    transition: all var(--transition-fast);
}

.card-hover:hover {
    border-color: var(--accent);
    box-shadow: var(--shadow-md);
    transform: translateY(-2px);
}

.card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-2);
    margin-bottom: var(--space-4);
    padding-bottom: var(--space-4);
    border-bottom: 1px solid var(--border-color);
    flex-wrap: wrap;
}

.card-title {
    font-size: var(--text-lg);
    font-weight: var(--font-semibold);

// Store (from store.js)
class Store {
    constructor() { this.state = {}; this.listeners = {}; }
    get(key) { return this.state[key]; }
    set(key, value) { this.state[key] = value; this.notify(key, value); }
    update(key, updater) { this.set(key, updater(this.state[key])); }
    subscribe(key, callback) {
        if (!this.listeners[key]) this.listeners[key] = [];
        this.listeners[key].push(callback);
        return () => { this.listeners[key] = this.listeners[key].filter(cb => cb !== callback); };
    }
    notify(key, value) {
        if (this.listeners[key]) this.listeners[key].forEach(cb => cb(value));
    }
}

function statusBg(s) { const m = {'НОВАЯ ЗАДАЧА':'#f1f5f9','НАЗНАЧЕНА КОМАНДА':'#f1f5f9','СБОР ТРЕБОВАНИЙ':'#f1f5f9','ПРОВЕРКА ТРЕБОВАНИЙ':'#f1f5f9','УТОЧНЕНИЕ ТРЕБОВАНИЙ':'#f1f5f9','ЭКСПРЕСС-ОЦЕНКА':'#f1f5f9','ПРИНЯТИЕ РЕШЕНИЯ':'#fef3c7','ПРИНЯТА В РАБОТУ':'#dbeafe','ЭСКАЛАЦИЯ НА ЛТ':'#ede9fe','ХОЛД':'#ede9fe','ОТКЛОНЕНА':'#fee2e2','НЕ АКТУАЛЬНА':'#f1f5f9','ВЫПОЛНЕНА':'#d1fae5'}; return m[s] || '#f1f5f9'; }

function formatTime(dateStr) { if (!dateStr) return ''; const d = new Date(dateStr); const now = new Date(); const diff = now - d; const mins = Math.floor(diff/60000); const hours = Math.floor(diff/3600000); const days = Math.floor(diff/86400000); if (mins < 1) return 'Только что'; if (mins < 60) return mins+' мин. назад'; if (hours < 24) return hours+' ч. назад'; if (days < 7) return days+' д. назад'; return d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'}); }

class Router {
    constructor(app) {
        this.app = app;
        this.routes = {
            '/dashboard': { render: renderDashboard, init: initDashboard },
            '/backlog': { render: renderBacklog, init: initBacklog },
            '/team-backlog': { render: renderTeamBacklog, init: initTeamBacklog },
            '/express-estimate': { render: renderExpressEstimate, init: initExpressEstimate },
            '/kanban': { render: renderKanban, init: initKanban },
            '/reports': { render: renderReports, init: initReports },
            '/analytics/tribe': { render: (a) => renderAnalyticsPage(a,'tribe'), init: (a) => initAnalyticsPage(a,'tribe') },
            '/analytics/po-pl': { render: (a) => renderAnalyticsPage(a,'po-pl'), init: (a) => initAnalyticsPage(a,'po-pl') },
            '/notifications': { render: renderNotifications, init: initNotifications },
            '/settings': { render: renderSettings, init: initSettings },
            '/admin': { render: renderAdmin, init: initAdmin },
            '/customer': { render: renderCustomer, init: initCustomer },
            '/customer/create': { render: renderCustomerCreate, init: initCustomerCreate },
        };
        this.defaultRoute = '/dashboard';
    }
    init() { window.addEventListener('hashchange', () => this.handleRoute()); this.handleRoute(); }
    navigate(path) { window.location.hash = path; }
    handleRoute() {
        const hash = window.location.hash.slice(1) || this.defaultRoute;
        const route = this.routes[hash];
        if (route) {
            const container = document.getElementById('page-content');
            if (container) {
                container.innerHTML = route.render(this.app);
                if (window.lucide) window.lucide.createIcons();
                updateBreadcrumb(hash);
                if (route.init) setTimeout(() => route.init(this.app), 50);
            }
        } else { this.navigate(this.defaultRoute); }
        updateSidebarActive(hash);
    }
}

function bindLoginForm() {
    const pwToggle = document.getElementById('login-pw-toggle');
    if (pwToggle) {
        pwToggle.addEventListener('click', () => {
            const pw = document.getElementById('login-password');
            const eye = document.getElementById('login-eye');
            if (pw.type === 'password') { pw.type = 'text'; eye.setAttribute('data-lucide', 'eye-off'); }
            else { pw.type = 'password'; eye.setAttribute('data-lucide', 'eye'); }
            if (window.lucide) window.lucide.createIcons();
        });
    }
    document.getElementById('login-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;
        if (password === 'dmb2026') {
            const user = USERS.find(u => u.email === email) || USERS[0];
            window.app.store.set('currentUser', user);
            localStorage.setItem('dmb_tokens', JSON.stringify({access:'demo-token',refresh:'demo-refresh'}));
            localStorage.setItem('dmb_user', JSON.stringify(user));
            window.app.renderAppLayout();
            window.app.router.init();
            window.app.router.navigate('/dashboard');
        } else {
            document.getElementById('login-error').style.display = 'flex';
        }
    });
}

// ============ APP CLASS ============
class App {
    constructor() {
        this.store = new Store();
        this.router = new Router(this);
        this.init();
    }
    init() {
        this.applyTheme();
        const tokens = JSON.parse(localStorage.getItem('dmb_tokens') || '{}');
        if (tokens.access) {
            const stored = JSON.parse(localStorage.getItem('dmb_user') || 'null');
            if (stored) this.store.set('currentUser', stored);
            this.renderAppLayout();
            this.router.init();
        } else {
            this.renderLoginPage();
        }
    }
    applyTheme() {
        const theme = localStorage.getItem('dmb_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', theme);
    }
    renderAppLayout() {
        const appEl = document.getElementById('app');
        appEl.innerHTML = renderAppShell('');
        if (window.lucide) window.lucide.createIcons();
        initApp(this);
    }
    renderLoginPage() { renderLoginPage(); }
}

        const icon = document.querySelector('#theme-toggle [data-lucide]');
        if (icon) icon.setAttribute('data-lucide', isDark ? 'moon' : 'sun');
        if (window.lucide) window.lucide.createIcons();
    });
    
    // Logout
    document.getElementById('logout-btn')?.addEventListener('click', () => {
        localStorage.removeItem('dmb_tokens');
        localStorage.removeItem('dmb_user');
        window.app.renderLoginPage();
    });
    
    // User dropdown
    const avatarBtn = document.getElementById('user-avatar-btn');
    const dropdown = document.getElementById('user-dropdown');
    if (avatarBtn && dropdown) {
        avatarBtn.addEventListener('click', (e) => { e.stopPropagation(); dropdown.classList.toggle('hidden'); });
    }
    document.addEventListener('click', (e) => {
        const dd = document.getElementById('user-dropdown');
        if (dd && !dd.contains(e.target) && !e.target.closest('#user-avatar-btn')) dd.classList.add('hidden');
    });
    
    // Search
    const searchInput = document.getElementById('global-search');
    if (searchInput) {
        let searchTimer;
        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => handleSearch(searchInput.value), 300);
        });
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.getElementById('search-results')?.classList.add('hidden');
                searchInput.blur();
            }
        });
    }
    document.addEventListener('click', (e) => {
        const wrap = document.querySelector('.search-wrap');
        if (wrap && !wrap.contains(e.target)) document.getElementById('search-results')?.classList.add('hidden');
    });
    
    // Open task event
    document.addEventListener('open-task', (e) => {
        const task = TASKS.find(t => t.id === 'TASK-' + String(e.detail.taskId).padStart(3, '0'));
        if (task) showTaskModal(task);
    });
}

// ============ SEARCH ============
let searchTasksCache = null;
function handleSearch(query) {
    const container = document.getElementById('search-results');
    if (!container || !query || query.length < 2) { container?.classList.add('hidden'); return; }
    if (!searchTasksCache) searchTasksCache = TASKS;
    const q = query.toLowerCase();
    const scored = searchTasksCache.map(t => {
        let score = 0;
        if (t.title && t.title.toLowerCase().includes(q)) score += 60;
        if (t.id.toLowerCase().includes(q)) score += 40;
        if (t.owner_name && t.owner_name.toLowerCase().includes(q)) score += 30;
        if (t.team_name && t.team_name.toLowerCase().includes(q)) score += 15;
        if (t.status && t.status.toLowerCase().includes(q)) score += 15;
        return { task: t, score };
    }).filter(r => r.score > 0).sort((a, b) => b.score - a.score).slice(0, 10);
    
    container.innerHTML = scored.length > 0
        ? scored.map(({task}) => '<div class="search-result-item" data-id="' + task.id.replace('TASK-', '') + '" tabindex="-1">' +
            '<div class="search-result-main"><span class="search-result-id">#' + task.id + '</span><span class="search-result-title">' + escapeHtml(task.title) + '</span></div>' +
            '<div class="search-result-meta"><span class="search-result-status">' + task.status + '</span></div></div>'
        ).join('')
        : '<div class="search-result-empty">Ничего не найдено</div>';
    
    container.classList.remove('hidden');
    container.querySelectorAll('.search-result-item').forEach(el => {
        el.addEventListener('click', () => {
            const taskId = parseInt(el.dataset.id);
            document.dispatchEvent(new CustomEvent('open-task', { detail: { taskId } }));
            container.classList.add('hidden');
            document.getElementById('global-search').value = '';
            searchTasksCache = null;
        });
    });
}

function initSettings() {
    document.getElementById('settings-theme-toggle')?.addEventListener('change', function() {
        const isDark = this.checked;
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        localStorage.setItem('dmb_theme', isDark ? 'dark' : 'light');
        const slider = this.nextElementSibling;
        if (slider) slider.style.background = isDark ? '#6366f1' : '#cbd5e1';
    });
    if (window.lucide) window.lucide.createIcons();
}

// ============ TASK MODAL ============
function showTaskModal(task) {
    const t = task || {};
    const container = document.getElementById('modal-container');
    let activeTab = 'overview';
    
    function renderModalContent() {
        const circumference = 2 * Math.PI * 15.5;
        const progress = t.progress || 0;
        const offset = circumference - (progress / 100) * circumference;
        const tabIcons = { overview:'info', team:'users', metrics:'bar-chart-2', docs:'file-text', reports:'file-text', history:'clock' };
        
        let html = '<div class="modal-overlay" id="task-detail-overlay">' +
        '<div class="task-detail-modal" id="task-detail-modal" role="dialog" aria-modal="true">' +
            '<div class="task-detail-modal-header">' +
                '<div class="task-detail-header-left">' +
                    '<div class="task-detail-badges-row">' +
                        '<span class="task-detail-id">#' + t.id + '</span>' +
                        '<span class="task-detail-badge" style="background:' + statusBg(t.status) + ';color:' + statusColor(t.status) + ';border-color:' + statusColor(t.status) + '33">' + escapeHtml(t.status) + '</span>' +
                        '<span class="task-detail-badge" style="background:' + (t.priority === 'ВЫСОКИЙ' ? '#fee2e2' : t.priority === 'СРЕДНИЙ' ? '#fef3c7' : '#f1f5f9') + ';color:' + (t.priority === 'ВЫСОКИЙ' ? '#ef4444' : t.priority === 'СРЕДНИЙ' ? '#f59e0b' : '#6b7280') + ';border-color:inherit">' + escapeHtml(t.priority) + '</span>' +
                        (t.key_project ? '<span class="task-detail-badge" style="background:#fef3c7;color:#d97706;border-color:#f59e0b33">⭐ Ключевой</span>' : '') +
                    '</div>' +
                    '<h2 class="task-detail-title">' + escapeHtml(t.title || '') + '</h2>' +
                '</div>' +
                '<div class="task-detail-header-actions">' +
                    '<button class="task-detail-btn-icon" id="td-close-btn" title="Закрыть"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>' +
                '</div>' +
            '</div>' +
            '<div class="task-detail-kpi-strip">' +
                '<div class="task-detail-kpi-item"><div class="kpi-ring-wrap"><svg viewBox="0 0 36 36" class="kpi-ring"><circle cx="18" cy="18" r="15.5" fill="none" stroke="#e7e5e4" stroke-width="3"/><circle cx="18" cy="18" r="15.5" fill="none" stroke="#6366f1" stroke-width="3" stroke-dasharray="' + circumference + '" stroke-dashoffset="' + offset + '" stroke-linecap="round"/></svg><div class="kpi-ring-text">' + progress + '%</div></div><div class="kpi-label">Прогресс</div></div>' +
                '<div class="task-detail-kpi-item kpi-border-left"><div class="kpi-value">' + metricFormat(t.financial_effect) + '</div><div class="kpi-label">Фин. эффект, ₽</div></div>' +
                '<div class="task-detail-kpi-item kpi-border-left"><div class="kpi-value">' + (t.effort_days != null ? t.effort_days : '—') + '</div><div class="kpi-label">Трудозатраты, ч/д</div></div>' +
                '<div class="task-detail-kpi-item kpi-border-left"><div style="display:flex;align-items:center;gap:8px"><div style="width:28px;height:28px;border-radius:50%;background:' + getAvatarColor(t.owner_name) + ';display:flex;align-items:center;justify-content:center;color:white;font-size:11px;font-weight:700;flex-shrink:0;">' + getUserInitials(t.owner_name) + '</div><div><div class="kpi-owner-name">' + escapeHtml(t.owner_name || '—') + '</div><div class="kpi-label">Владелец</div></div></div></div>' +
            '</div>' +
            '<div class="task-detail-tabs">' +
                '<button class="td-tab-btn' + (activeTab === 'overview' ? ' active' : '') + '" data-tab="overview"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> Обзор</button>' +
                '<button class="td-tab-btn' + (activeTab === 'team' ? ' active' : '') + '" data-tab="team"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> Команда</button>' +
                '<button class="td-tab-btn' + (activeTab === 'metrics' ? ' active' : '') + '" data-tab="metrics"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg> Метрики</button>' +
                '<button class="td-tab-btn' + (activeTab === 'docs' ? ' active' : '') + '" data-tab="docs"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg> Документы</button>' +
                '<button class="td-tab-btn' + (activeTab === 'reports' ? ' active' : '') + '" data-tab="reports"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h20"/><path d="M21 3v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3"/><path d="M7 21h10"/><path d="M12 16v5"/></svg> Отчётность</button>' +
                '<button class="td-tab-btn' + (activeTab === 'history' ? ' active' : '') + '" data-tab="history"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg> История</button>' +
            '</div>' +
            '<div class="task-detail-modal-body" id="td-modal-body">' +
                '<div class="td-tab-panel' + (activeTab === 'overview' ? ' active' : '') + '" id="tab-overview">' + renderOverviewTab(t) + '</div>' +
                '<div class="td-tab-panel' + (activeTab === 'team' ? ' active' : '') + '" id="tab-team">' + renderTeamTab(t) + '</div>' +
                '<div class="td-tab-panel' + (activeTab === 'metrics' ? ' active' : '') + '" id="tab-metrics">' + renderMetricsTab(t) + '</div>' +
                '<div class="td-tab-panel' + (activeTab === 'docs' ? ' active' : '') + '" id="tab-docs">' + renderDocsTab(t) + '</div>' +
                '<div class="td-tab-panel' + (activeTab === 'reports' ? ' active' : '') + '" id="tab-reports">' + renderReportsTab(t) + '</div>' +
                '<div class="td-tab-panel' + (activeTab === 'history' ? ' active' : '') + '" id="tab-history"><div class="text-muted" style="text-align:center;padding:40px">История изменений пуста</div></div>' +
            '</div>' +
            '<div class="task-detail-modal-footer">' +
                '<div class="task-detail-footer-info"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span>Дата: ' + (t.date_received || '—') + '</span></div>' +
                '<div class="task-detail-footer-actions"></div>' +
            '</div>' +
        '</div></div>';
        container.innerHTML = html;
    }
    
    function renderOverviewTab(t) {
        const tags = t.tags ? String(t.tags).split(',').map(s => s.trim()).filter(Boolean) : [];
        return '<div class="task-detail-section-card">' +
            '<div class="task-detail-section-title">Блок 1 · Общая информация</div>' +
            infoRow('Название', '<strong>' + escapeHtml(t.title||'') + '</strong>') +
            infoRow('Статус', '<span class="task-detail-badge" style="background:' + statusBg(t.status) + ';color:' + statusColor(t.status) + ';border-color:' + statusColor(t.status) + '33">' + escapeHtml(t.status||'') + '</span>') +
            infoRow('Приоритет', '<span class="task-detail-badge" style="background:' + (t.priority === 'ВЫСОКИЙ' ? '#fee2e2' : t.priority === 'СРЕДНИЙ' ? '#fef3c7' : '#f1f5f9') + ';color:' + (t.priority === 'ВЫСОКИЙ' ? '#ef4444' : t.priority === 'СРЕДНИЙ' ? '#f59e0b' : '#6b7280') + ';border-color:inherit">' + escapeHtml(t.priority||'') + '</span>') +
            infoRow('Ключевой проект', t.key_project ? '<span class="task-detail-badge" style="background:#fef3c7;color:#d97706;border-color:#f59e0b33">⭐ Да</span>' : '<span class="text-muted">—</span>') +
            (tags.length ? infoRow('Теги', tags.map(tag => '<span class="task-detail-tag">' + escapeHtml(tag) + '</span>').join(' ')) : '') +
            '<div class="task-detail-section-title">Блок 2 · Бизнес-контекст</div>' +
            infoRow('Описание', escapeHtml(t.description||'—'), {fullWidth:true}) +
            infoRow('Бизнес-заказчик', escapeHtml(t.business_customer||'—')) +
            infoRow('Канал поступления', escapeHtml(t.channel_name||'—')) +
            infoRow('Проект', escapeHtml(t.project_name||'—')) +
            infoRow('Дата поступления', t.date_received||'—') +
            infoRow('Срок (дедлайн)', escapeHtml(t.deadline||'—')) +
            '<div class="task-detail-section-title">Блок 3 · Статусы для разных аудиторий</div>' +
            infoRow('Статус для директорской', escapeHtml(t.directorate_status||'—')) +
            infoRow('Статус для ДИД', escapeHtml(t.did_status||'—')) +
        '</div>';
    }
    
    function renderTeamTab(t) {
        return '<div class="task-detail-section-card">' +
            '<div class="task-detail-section-title">Блок 1 · Ответственные</div>' +
            infoRow('Команда', '<span class="task-detail-chip" style="background:' + (TEAMS.find(x=>x.name===t.team_name)?.color||'#6366f1') + '22;color:' + (TEAMS.find(x=>x.name===t.team_name)?.color||'#6366f1') + '">' + escapeHtml(t.team_name||'—') + '</span>') +
            '<div class="task-detail-roles-grid">' +
                roleCard(t.owner_name, 'Владелец / PL') +
            '</div>' +
        '</div>';
    }
    
    function roleCard(name, label) {
        if (!name) return '';
        return '<div class="task-detail-role-card"><div style="display:flex;align-items:center;gap:12px;"><div style="width:36px;height:36px;border-radius:50%;background:' + getAvatarColor(name) + ';display:flex;align-items:center;justify-content:center;color:white;font-size:14px;font-weight:700;flex-shrink:0;">' + getUserInitials(name) + '</div><div><div class="task-detail-role-label">' + label + '</div><div class="task-detail-role-name">' + escapeHtml(name) + '</div></div></div></div>';
    }
    
    function renderMetricsTab(t) {
        return '<div class="task-detail-section-card">' +
            '<div class="task-detail-kpi-grid">' +
                '<div class="kpi-card-item"><div class="kpi-card-label">💰 Фин. эффект</div><div class="kpi-card-value">' + metricFormat(t.financial_effect) + ' ₽</div></div>' +
                '<div class="kpi-card-item"><div class="kpi-card-label">⏱ Трудозатраты</div><div class="kpi-card-value">' + (t.effort_days != null ? t.effort_days + ' ч/д' : '—') + '</div><div class="kpi-card-sub">' + (t.effort_rub != null ? metricFormat(t.effort_rub) + ' ₽' : '—') + '</div></div>' +
                '<div class="kpi-card-item"><div class="kpi-card-label">📈 Прогресс</div><div class="kpi-card-value">' + (t.progress||0) + '%</div><div class="progress-track" style="margin-top:8px"><div class="progress-fill" style="width:' + (t.progress||0) + '%"></div></div></div>' +
            '</div>' +
        '</div>';
    }
    
    function renderDocsTab(t) {
        return '<div class="task-detail-section-card"><div class="text-muted" style="text-align:center;padding:40px">Нет прикреплённых документов</div></div>';
    }
    
    function renderReportsTab(t) {
        return '<div class="task-detail-section-card">' +
            '<div class="task-detail-section-title">Блок 1 · Статус для отчётов</div>' +
            '<div class="task-detail-meta-grid">' +
                '<div class="meta-item"><div class="meta-label">Состояние</div><div class="meta-value" style="color:' + ((t.progress||0) >= 100 ? '#10b981' : (t.progress||0) > 0 ? '#f59e0b' : '#6b7280') + '">' + ((t.progress||0) >= 100 ? '✅ Завершена' : (t.progress||0) > 0 ? '🔄 В работе' : '📋 Не начата') + '</div></div>' +
                '<div class="meta-item"><div class="meta-label">Дедлайн</div><div class="meta-value">' + escapeHtml(t.deadline||'—') + '</div></div>' +
                '<div class="meta-item"><div class="meta-label">Основной статус</div><div class="meta-value">' + statusBadge(t.status) + '</div></div>' +
                '<div class="meta-item"><div class="meta-label">Ключевой проект</div><div class="meta-value">' + (t.key_project ? '⭐ Да' : '—') + '</div></div>' +
            '</div>' +
        '</div>';
    }
    
    function infoRow(label, valueHtml, opts) {
        const cls = opts?.fullWidth ? ' task-detail-info-row-full' : '';
        return '<div class="task-detail-info-row' + cls + '"><div class="task-detail-label">' + label + '</div><div class="task-detail-value">' + valueHtml + '</div></div>';
    }
    
    renderModalContent();
    if (window.lucide) window.lucide.createIcons();
    
    // Tab switching
    document.querySelectorAll('.td-tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            activeTab = btn.dataset.tab;
            document.querySelectorAll('.td-tab-btn, .td-tab-panel').forEach(el => el.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('tab-' + activeTab)?.classList.add('active');
        });
    });
    
    // Close
    document.getElementById('td-close-btn')?.addEventListener('click', () => { container.innerHTML = ''; });
    document.getElementById('task-detail-overlay')?.addEventListener('click', (e) => {
        if (e.target === e.currentTarget) container.innerHTML = '';
    });
    document.addEventListener('keydown', function escHandler(e) {
        if (e.key === 'Escape') { container.innerHTML = ''; document.removeEventListener('keydown', escHandler); }
    });
}

// ============ TOAST ============
window.toast = function(msg, type) {
    const container = document.getElementById('toast-container');
    if (!container) return;
    const toast = document.createElement('div');
    toast.className = 'toast toast-' + (type||'success');
    toast.innerHTML = '<span class="toast-icon">' + {'success':'✓','error':'✕','info':'ℹ','warning':'⚠'}[type||'success'] + '</span><span class="toast-message">' + escapeHtml(msg) + '</span>';
    container.appendChild(toast);
    setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, type === 'error' ? 5000 : 3000);
};

// ============ INIT ============
document.addEventListener('DOMContentLoaded', () => {
    window.app = new App();
});
