<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Реализация верхних панелей</title><style>
*{box-sizing:border-box}body{font:15px/1.5 system-ui,sans-serif;background:#f7f9fc;color:#18304b;margin:0}header{padding:28px 32px 20px;border-bottom:1px solid #dce3ee;background:white}h1{font-size:26px;margin:0 0 8px}p{margin:6px 0;color:#4d6077}nav,.options{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}button,a{font:inherit}button{border:1px solid #c7d2e4;padding:8px 12px;border-radius:8px;background:white;color:#263e5a;cursor:pointer}button[aria-pressed=true]{background:#5040e9;border-color:#5040e9;color:white}button:focus-visible,a:focus-visible{outline:3px solid #5040e9;outline-offset:3px}main{padding:24px 32px}figure{margin:16px 0}img{display:block;width:100%;height:auto;border:1px solid #dce3ee;background:white}body.mobile img{max-width:390px;margin:auto}#note{max-width:900px}a{color:#4432c7}.links{display:flex;gap:20px;margin:12px 0}@media(max-width:600px){header,main{padding:18px}h1{font-size:22px}}
</style><header><h1>Реализация верхних панелей</h1><p>Бэклог — исходный эталон. Остальные страницы — реализованные изменения. Демонстрационные данные, 11 ноября 2026.</p><nav aria-label="Страница"><button data-page="backlog" aria-pressed="true">Бэклог</button><button data-page="metrics" aria-pressed="false">Метрики</button><button data-page="projects" aria-pressed="false">Проекты</button><button data-page="work" aria-pressed="false">Рабочие задачи</button><button data-page="review" aria-pressed="false">Запросы заказчиков</button><button data-page="customer" aria-pressed="false">Мои запросы</button></nav><div class="options"><button id="light" aria-pressed="true">Светлая</button><button id="dark" aria-pressed="false">Тёмная</button><button id="desktop" aria-pressed="true">1440 × 900</button><button id="mobile" aria-pressed="false">390 px · полный экран</button></div></header><main><p id="note"></p><div class="links"><a id="download" download>Скачать PNG</a><a id="before" target="_blank">Исходный экран</a></div><figure><img id="screen" src="backlog-light-1440.png" alt="Бэклог — эталон"></figure><p>Снимки исполняемого приложения на изолированных данных. Переключатели галереи работают локально.</p></main><script>
const names={"backlog":"Бэклог","metrics":"Метрики","projects":"Проекты","work":"Рабочие задачи","review":"Запросы заказчиков","customer":"Мои запросы"},notes={"backlog":"Неизменённый эталон. Текущий интерфейс на изолированных демонстрационных данных.","metrics":"Период перед действиями; компактные контролы; основные условия под поиском.","projects":"Компактный переключатель вида; команда и ответственный под поиском.","work":"Создание перед видом и обновлением; поиск отдельно от условий; очереди сохраняют свой смысл.","review":"Навигация предмета ревью сохранена; основные фильтры на общей подложке.","customer":"Создание перед обновлением; подборки ниже поиска; сортировка внутри панели."};let page='backlog',theme='light',width=1440;
function render(){const file=page+'-'+theme+'-'+width+'.png';screenImg.src=file;screenImg.alt=names[page]+' — '+(page==='backlog'?'эталон':'реализация');document.querySelector('#note').textContent=notes[page];document.querySelector('#download').href=file;document.querySelector('#before').href=page+'-before.png';document.body.classList.toggle('mobile',width===390);document.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.page===page));['light','dark'].forEach(x=>document.getElementById(x).setAttribute('aria-pressed',x===theme));document.getElementById('desktop').setAttribute('aria-pressed',width===1440);document.getElementById('mobile').setAttribute('aria-pressed',width===390);document.getElementById('dark').disabled=width===390;}
const screenImg=document.getElementById('screen');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});document.getElementById('light').onclick=()=>{theme='light';render()};document.getElementById('dark').onclick=()=>{theme='dark';render()};document.getElementById('desktop').onclick=()=>{width=1440;render()};document.getElementById('mobile').onclick=()=>{width=390;theme='light';render()};render();</script></html>
