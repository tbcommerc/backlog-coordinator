[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-prioritiser"
version = "0.1.0"
description = "Агент-приоритизатор инициатив трайба: единая методика Value и приоритета P1-P5 для Единого бэклога"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Daniil Ibragimov", email = "ibragimov.daniil.hse@gmail.com" }]
dependencies = [
    "SQLAlchemy>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "PyYAML>=6.0",
    "python-dateutil>=2.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "rank-bm25>=0.2.2",
    "faiss-cpu>=1.8",
    "sentence-transformers>=3.3",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.69"]
ui = ["streamlit>=1.40", "pandas>=2.2"]
dev = ["pytest>=8.3"]

[project.scripts]
prioritiser = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
