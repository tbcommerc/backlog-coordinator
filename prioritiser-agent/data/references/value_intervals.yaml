# Калибровка интервала оценки Value.
#
# Файл порождается скриптом и правится только через него:
#     python3 scripts/value_calibrate.py --write
#
# Множители получены конформной калибровкой на задачах, где Value
# заполнил человек:
#     нижняя граница = оценка / down_factor
#     верхняя граница = оценка * up_factor
# Целевое покрытие — 95%.
#
# Интервал у уровня low очень широк, и это не дефект калибровки:
# оценка низкой уверенности действительно ничего не гарантирует.
# Единственный способ его сузить — заполнить Value вручную.
version: 1
target_coverage: 0.95
methods:
  analogy:
    high:
      down_factor: 351.0
      up_factor: 3.941
      samples: 9
      coverage: null
      calibrated: false
      inherited_from: 'более широкий уровень: наблюдений меньше 20, конформная граница
        не определена'
    medium:
      down_factor: 351.0
      up_factor: 3.941
