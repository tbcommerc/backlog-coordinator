# Веса факторов приоритизации. Сумма обязана равняться 1.0, это проверяется при
# сохранении справочника. Подлежат калибровке по итогам первых 3 месяцев
# эксплуатации.
#
# Версия 4: коды факторов сброшены и идут подряд, F1–F7. До этого нумерация шла
# от ТЗ и сохраняла дыру на месте исключённого C/V, а последний фактор носил
# номер F8 при семи факторах в модели. Дыра ничего не обозначала и требовала
# объяснения в каждом документе. Соответствие прежним записям восстанавливается
# по версии методики в аудите ответа. Решение владельца от 2026-08-26.
#
# Версия 3: уверенность в оценке Value перестала быть отдельным слагаемым и
# стала множителем при факторе Value. Уверенность — не свойство задачи, а
# свойство того, насколько хорошо мы знаем её Value; слагаемым она давала
# прибавку независимо от величины самого Value. Её вес 0.03 передан фактору
# Value: 0.31 → 0.34. Та же природа ошибки, что у C/V.
#
# Версия 2: отношение C/V убрано из факторов как мультиколлинеарное. C/V =
# Cost / Value, а Cost — это трудозатраты, умноженные на константу. То есть C/V
# целиком выводится из вводных, которые уже учтены факторами Value и
# «Ресурсоёмкость», и не приносит в модель ни одной новой величины. Его вес 0.25
# возвращён тем двум факторам, которые он дублировал, в пропорции измеренного
# влияния (62.5% Value, 37.5% трудозатраты): Value 0.15 → 0.31, ресурсоёмкость
# 0.08 → 0.17. Измерение — docs/DEVIATIONS-FROM-TZ.md, раздел 6.
version: 4
weights:
  F1_value: 0.34          # Value (внутренний) × уверенность в оценке
  F2_customer_level: 0.15 # Уровень бизнес-заказчика, дискретно
  F3_urgency: 0.15        # Срочность, ступенчато по дням до дедлайна
  F4_effort: 0.17         # Ресурсоёмкость, обратная нормализация
  F5_strategy_fit: 0.10   # Стратегическое соответствие, оценка субагента
  F6_dependencies: 0.05   # Зависимость от других команд, обратная
  F7_task_type: 0.04      # Тип задачи, дискретно из справочника

# Пороги преобразования скора в приоритет (ТЗ Ф20).
priority_bands:
  P1: 0.8
  P2: 0.6
  P3: 0.4
  P4: 0.2
  # ниже P4 — P5

# Параметры нормализации отдельных факторов.
normalisation:
  F3_urgency:
    # Ступени: (порог в днях, балл). Просроченные задачи получают верхний балл.
    steps: [[30, 1.0], [90, 0.7], [180, 0.4]]
    fallback: 0.1
    no_deadline: 0.1
  F4_effort:
    # Обратная: 1.0 при < low_man_days, 0.3 при > high_man_days, линейно между.
    low_man_days: 5
    high_man_days: 50
    low_score: 1.0
    high_score: 0.3
    unknown: 0.5
  F5_strategy_fit:
    # Балл 1..10 от Strategy Decomposer → 0.1..1.0
    raw_min: 1
    raw_max: 10
    out_min: 0.1
    out_max: 1.0
  F6_dependencies:
    # 0 вовлечённых команд = 1.0, далее убывание на step за каждую.
    step: 0.2
    floor: 0.2
  F1_confidence_multiplier:
    high: 1.0
    medium: 0.7
    low: 0.3
