  - id: methodology
    name: Methodology
    mission: >-
      Создание и актуализация нормативной базы и методологических/продуктовых решений
      по направлениям ДИД (мезонин и equity, M&A, ECM/DCM, ЦФА), оптимизация
      инвестиционного и кредитного процессов, согласование документов со смежными
      подразделениями, методологическая поддержка и консультирование, участие
      в прототипировании автоматизированных решений трайба.
    products:
      - album_ref: did-methodology
    competencies:
      - нормативная база и ВНД
      - методология мезонин/equity/M&A/ECM/DCM/ЦФА
      - согласования со смежниками (ДКК, ДРКБ, ДККК, ДКПП, ТБ, Риски, ПД, Compliance, ДГР, ЦСОГР, ДРПА)
      - методподдержка инвестиционного процесса
    capacity: { period: quarter, value: null, unit: fte, note: 'нет данных — placeholder, по решению владельца не учитывается' }
