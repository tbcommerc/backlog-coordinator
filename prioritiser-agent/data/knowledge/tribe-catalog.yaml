  - id: ib
    name: IB (M&A)
    mission: >-
      Онлайн-инструмент ведения пайплайна M&A сделок: совместная работа M&A-команды,
      автоматизированный обмен информацией и задачами с клиентскими менеджерами и ДРКБ,
