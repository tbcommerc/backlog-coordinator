  - id: delivery
    name: Delivery
    mission: >-
      DevOps pipeline по всем микросервисам и микрофронтам трайба, управление релизами
      и релизным циклом, управление инфраструктурой, сопровождение ИТ-услуг трайба.
    products:
      - album_ref: ibp-delivery
    competencies: [DevOps/CI-CD, релиз-менеджмент, инфраструктура, сопровождение ИТ-услуг]
