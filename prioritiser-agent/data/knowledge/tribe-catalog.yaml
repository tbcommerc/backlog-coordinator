teams:
  - id: pre-trade
    name: Pre-trade
    mission: >-
      Воронка и пайплайн сделок ДИД до выдачи средств: выявление сделок с акционерным
      риском в кредитном конвейере, привлечение ДИД, маршрутизация лидов, рост воронки
      и конверсии в выдачи. Рабочее место ДИД на платформе IBP, триггеры подключения
      ДИД в процессы Банка, AI/GenAI-инструменты поиска и обработки сделок.
    products:
      - album_ref: ibp-pre-trade
    competencies:
      - лид-менеджмент и пайплайн сделок
      - интеграция в кредитный конвейер
      - аналитика воронки/конверсии/дохода
      - GenAI-идентификация сделок с акционерным риском
      - взаимодействие со смежными службами до выдачи
    capacity: { period: quarter, value: null, unit: fte, note: 'нет данных — placeholder, по решению владельца не учитывается' }
    dependencies: [ibp-platform, отраслевые-дески-ДИД, вертикаль-ДИД-ТБ, кредитный-процесс]

  - id: post-trade
    name: Post-trade
    mission: >-
      Сквозной учёт и сопровождение заключённых сделок ДИД: расчётный движок РСБУ/МСФО,
      операционная видимость по сделкам и платежам, синхронизация с учётными системами,
      дашборды портфеля для руководства, исполнение регуляторных требований.
    products:
      - album_ref: ibp-post-trade
    competencies:
      - учёт и сопровождение сделок
      - финансовые расчёты РСБУ/МСФО
      - интеграции API (ЕПК, КАП, Risk Store, 1С/Navision)
      - управленческие дашборды портфеля
      - снижение операционных рисков
    capacity: { period: quarter, value: null, unit: fte, note: 'нет данных — placeholder, по решению владельца не учитывается' }
    dependencies: [ЕПК, КАП, Risk-Store, 1С-Navision, Финансы-СБИ, Риски-СБИ]

  - id: ai
    name: AI
    mission: Разработка и внедрение решений на основе искусственного интеллекта для трайба и ДИД.
    products:
      - album_ref: ibp-ai
    competencies: [машинное обучение, GenAI/LLM, интеграция AI в бизнес-процессы]
    capacity: { period: quarter, value: null, unit: fte, note: 'нет данных — placeholder, по решению владельца не учитывается' }
    dependencies: [ibp-platform, данные-сделок]

  - id: core
    name: Core
    mission: >-
      Базовые сервисы Investment Banking Platform как «лего» для других команд трайба:
      AI-помощник ДИД, Главный экран, Мои Клиенты, Задачи, Уведомления, Пользователи,
      Настройки, работа с документами ЭКД. Поставка в виде API, UI Kit, микроприложений.
    products:
      - album_ref: ibp-core
    competencies:
      - платформенные API и UI Kit
      - фронтальные микроприложения
      - единый клиентский опыт
      - переиспользуемые сервисы для команд трайба
