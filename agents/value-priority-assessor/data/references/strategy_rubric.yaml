# Рубрики оценки факторов F5 и F6.
#
# По ТЗ (Ф16) значения этих факторов приходят от внешнего агента Strategy
# Decomposer одним числом. Решение владельца от 2026-08-11: считать их внутри
# проекта собственными субагентами.
#
# Ключевое требование к реализации: субагент отвечает на критерии рубрики,
# балл вычисляет код. Модель, выдающая «7 из 10» одним числом, не поддаётся ни
# проверке, ни воспроизведению — а именно воспроизводимость отличает методику
# от мнения. Ответ по рубрике, наоборот, можно оспорить по пунктам: методолог
# видит, какой критерий дал вклад, и спорит с ним, а не с итоговой цифрой.
#
# Справочник настраивается методологом. Изменение рубрики — основание для
# переоценки: сохранённые оценки помечаются устаревшими по версии рубрики.
version: 1
updated_at: "2026-08-11"

# --- F5. Стратегическое соответствие ----------------------------------------
strategy_fit:
  rubric_version: 1
  # Сумма весов критериев должна равняться 1 (проверяется при сохранении).
  criteria:
    - id: strategic_theme
      title: "Привязка к стратегической теме трайба"
      weight: 0.30
      question: >-
        Насколько задача связана с заявленными направлениями развития трайба —
        рост воронки и дохода ДИД, платформа IBP, AI-инструменты, качество
        сопровождения сделок?
      options:
        direct: { value: 1.0, title: "Прямо реализует одно из направлений" }
        supporting: { value: 0.6, title: "Поддерживает направление косвенно" }
        adjacent: { value: 0.3, title: "Соседняя область, связь слабая" }
        none: { value: 0.0, title: "Связи с направлениями трайба нет" }

    - id: revenue_link
      title: "Связь с доходом"
      weight: 0.25
      question: >-
        Как задача влияет на доход ДИД: напрямую увеличивает число или объём
        сделок, снимает ограничение на пути к сделке, или не влияет?
      options:
        direct: { value: 1.0, title: "Прямо увеличивает число или объём сделок" }
        enabling: { value: 0.6, title: "Снимает ограничение на пути к сделке" }
        indirect: { value: 0.3, title: "Влияние опосредованное и отложенное" }
        none: { value: 0.0, title: "На доход не влияет" }

    - id: client_impact
      title: "Влияние на клиентский путь"
      weight: 0.20
      question: >-
        Затрагивает ли задача путь корпоративного клиента ДИД — привлечение,
        рассмотрение сделки, сопровождение после выдачи?
      options:
        core: { value: 1.0, title: "Меняет ключевой этап клиентского пути" }
        partial: { value: 0.6, title: "Затрагивает вспомогательный этап" }
        internal: { value: 0.2, title: "Чисто внутренняя работа, клиент не видит" }
        none: { value: 0.0, title: "К клиентскому пути отношения не имеет" }

    - id: platform_leverage
      title: "Переиспользуемость результата"
      weight: 0.15
      question: >-
        Результат задачи — платформенный (им пользуются несколько команд),
        командный или разовый?
      options:
        platform: { value: 1.0, title: "Платформенный, переиспользуется командами" }
        team: { value: 0.5, title: "Полезен одной команде" }
        one_off: { value: 0.1, title: "Разовое решение под конкретный случай" }

    - id: mandate_fit
      title: "Соответствие мандату команды"
      weight: 0.10
      question: >-
        Задача попадает в зону ответственности команды-исполнителя или это
        чужая работа, взятая по случаю?
      options:
        core: { value: 1.0, title: "Прямо в мандате команды" }
        stretch: { value: 0.5, title: "На границе мандата" }
        foreign: { value: 0.0, title: "Вне мандата команды" }

  # Взвешенная сумма (0..1) переводится в шкалу ТЗ 1..10, которую дальше
  # нормализует фактор F5.
  scale:
    raw_min: 1
    raw_max: 10

  # Оценка без опоры на найденные источники не считается надёжной: понизить
  # уверенность честнее, чем принять мнение модели за факт.
  confidence:
    high_min_evidence: 2
    medium_min_evidence: 1

# --- F6. Зависимость от других команд ---------------------------------------
dependencies:
  rubric_version: 1
  question: >-
    Какие команды, кроме исполнителя, должны что-то сделать, чтобы задача была
    завершена, и какого рода эта зависимость?

  # Штраф зависит не только от числа команд, но и от типа связи. Задача, где
  # три команды достаточно уведомить, и задача, заблокированная одной чужой
  # поставкой, — разные по управляемости, а прежний счётчик команд их не
  # различал.
  types:
    blocking:
      penalty: 0.25
      title: "Блокирующая: работа не начнётся, пока команда не сделает своё"
    coordination:
      penalty: 0.12
      title: "Согласование: можно вести параллельно, но нужна синхронизация"
    informational:
      penalty: 0.04
      title: "Информирование: достаточно уведомить"

  base_score: 1.0
  floor: 0.2
