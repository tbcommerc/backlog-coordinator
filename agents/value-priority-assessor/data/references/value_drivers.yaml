  # --- Из финансовой модели ДИД --------------------------------------------
  #
  # Источник — выгрузка драйверов финансового эффекта трайба Digital Merchant
  # Banking с привязкой к учёту: статья ВУ ПЧОД («Чистые прочие доходы»), статья
  # баланса AR_09_03_08, ID бизнес-процесса 20011, сегменты «Крупнейший,
  # крупный, средний бизнес, КФИ». Это делает их надёжнее величин, извлечённых
  # из пояснений команд: там числа были рабочими допущениями авторов задач,
  # здесь — позициями финансовой модели.
  #
  # ВАЖНО о числе сделок. 30 и 25 — это годовой объём **команды** с учётом доли
  # вовлечения, а не прирост от одной инициативы. Подставлять их в формулу как
  # «сделок в год от этой задачи» нельзя: оценка вырастет в десятки раз и будет
  # означать, что каждая инициатива приносит весь годовой доход направления.
  # Их место — база, от которой считается прирост (см. `deal_count_uplift_from_speed`).
  ib_new_deals_per_year:
    title: "Новых сделок IB за год с учётом доли вовлечения"
    value: 30
    unit: "шт/год"
    category: deal_economics
    source: "Финансовая модель ДИД, ID БП 20011, статья ВУ ПЧОД"
    updated_at: "2026-08-20"
    tier: measured
    applies_to:
