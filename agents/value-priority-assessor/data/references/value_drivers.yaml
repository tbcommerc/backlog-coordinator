    title: "Средний доход по одной сделке Pre-trade"
    value: 100
    unit: "млн ₽"
    category: deal_economics
    source: "Финансовая модель ДИД, ID БП 20011, статья ВУ ПЧОД"
    updated_at: "2026-08-20"
    tier: measured
    applies_to:
      teams: ["Pre-Trade"]
    comment: >-
      Расходится в 3.7 раза с величиной, выведенной из обоснования команды
      (9 млн ₽/мес × 3 мес = 27 млн ₽). Решением владельца от 2026-08-20
      действующей считается эта: у финансовой модели есть привязка к статьям
      учёта, а 9 млн ₽/мес было рабочим допущением автора задачи. Прежний
      драйвер помечен `superseded_by` и в расчёте не участвует.
      Косвенное подтверждение: 25 сделок × 100 млн = 2500 млн ₽ в год, ровно та
