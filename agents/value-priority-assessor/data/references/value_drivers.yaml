# Параметры методики расчёта. Раньше лежали в отдельном constants.yaml с
# пометкой «ТЗ v2.0, Ф4», но владелец этих значений не задавал и происхождение
# подтвердить не удалось — файл упразднён 2026-08-14, всё живёт здесь, рядом с
# величинами, из которых считается.
#
# Ставки труда здесь НЕ дублируются: стоимость часа и минуты выводятся из
# `fte_annual_budget_rub` и производственного календаря. Хранить их отдельно
# значило бы завести второй источник правды, который рано или поздно разойдётся
# с первым — ровно это и случилось со старым файлом.
policy:
  discount_rate_annual:
    title: "Ставка дисконтирования"
    value: 0.24
    unit: "доля/год"
    source: "ROE Сбера; решение владельца от 2026-08-14"
    tier: measured
    comment: >-
      Прежнее значение 0.20 происхождения не имело. Отдельно стоит помнить, что
      команды в своих обоснованиях дисконтирование не применяют вовсе: оценка
      агента при тех же вводных выходит примерно на треть ниже той, что команда
      защитила бы вручную.

  horizon_years:
    title: "Горизонт расчёта эффекта"
    value: 3
    unit: "лет"
    source: "Методика; отсчёт с периода, следующего за сроком выполнения"
    tier: measured

  discounting_enabled:
    title: "Дисконтирование включено"
    value: true
    unit: "флаг"
    source: "Решение итерации 4"
    tier: measured
    comment: >-
      Выключатель нужен, чтобы сравнить оценку агента с расчётом команды
      напрямую: команды считают недисконтированные суммы.

# Рабочих дней в году — по производственному календарю, а не усреднённо:
# на трёхлетнем горизонте разница между 247 и 252 днями даёт около 2% в оценке
# экономии времени, и это единственная величина здесь, которая меняется от года
# к году сама по себе.
working_days_per_year:
  default: 247
  by_year:
    2026: 247
    2027: 247
    2028: 248
    2029: 247

# Разрешённые замены: чем можно воспользоваться, если драйвера нет.
# Ключ — недостающий драйвер, значение — чем его допустимо заменить.
# Каждая замена должна быть осмысленной: одинаковая природа величины и
# сопоставимый порядок.
substitutions:
  avg_deal_revenue_rub_per_month:
    use: option_revenue_rub_per_month
    comment: >-
      Только для задач по опционному портфелю. Природа величины та же — доход
      на один инструмент в месяц, — но порядок отличается вдвое, поэтому
      уверенность понижается.

# Замена величины, привязанной к команде: чем считать, если у самой команды
# драйвера нет. Решение владельца от 2026-08-18 — брать соседнюю
# зарабатывающую команду, а не отказываться от расчёта: оценка с понижённой
# уверенностью полезнее пустоты, а расхождение видно в перекрёстной проверке.
#
# Оговорка, которую нельзя терять: у IB годовой доход 12 млрд и сделки другого
# масштаба, чем у Pre-Trade. Подстановка 27 млн — рабочее приближение до тех
# пор, пока финансист не внесёт стоимость сделки IB, а не утверждение о
# равенстве. Поэтому уверенность понижается на ступень и происхождение
# помечается как `substitution`.
team_substitutions:
  deal_value:
    default_source_team: "Pre-Trade"
    comment: >-
      Стоимость сделки берётся у Pre-Trade для любой зарабатывающей команды,
      у которой своей нет.

# Как отсутствие драйвера влияет на уверенность оценки.
confidence_policy:
  substitution_penalty: 1      # на сколько ступеней понижается уверенность
  assumption_confidence: low   # уверенность при предположении из здравого смысла
  assumed_tier_caps_confidence: medium
