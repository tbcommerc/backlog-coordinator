# Справочник драйверов расчёта финансового эффекта.
#
# Отсюда агент берёт величины для расчёта Value: стоимость сделки, ставку
# специалиста, стоимость минуты ПШЕ и подобное. Заполняется методологом и
# финансистом; агент справочник только читает.
#
# Источник версии 2 — таблица обоснований финансового результата команд трайба
# (Pre-Trade, Post, Finance, Meth, Core, IB), 71 задача. В справочник попало
# только то, что удалось воспроизвести арифметически: каждая величина ниже
# участвует хотя бы в одном расчёте, который сходится с заявленным результатом.
# Пять строк таблицы, где число не выводится из пояснения ни при какой ставке,
# намеренно не разбирались на драйверы — из них извлекается только результат,
# а не величина.
#
# ---------------------------------------------------------------------------
# КАК ЗАПОЛНЯТЬ
#
# Каждый драйвер — запись вида:
#
#   deal_value_ma:
#     title: "Стоимость одной сделки M&A"
#     value: 50000000
#     unit: "₽"
#     source: "Финансовая модель ДИД, 2026"   # откуда цифра, обязательно
#     updated_at: "2026-08-14"
#     tier: measured                          # measured | expert | assumed
#     applies_to:                             # необязательное сужение области
#       teams: ["IB"]
#
# Поле `tier` — не украшение, оно управляет уверенностью оценки:
#
#   measured — величина получена из отчётности или финмодели;
#   expert   — экспертная оценка методолога или финансиста;
#   assumed  — предположение, поставленное «чтобы считалось».
#
# Оценка, собранная хотя бы из одного `assumed`-драйвера, не может получить
# высокий уровень уверенности. Это защищает от ситуации, когда придуманное
# число проходит через формулу и выходит из неё выглядящим как факт.
#
# ---------------------------------------------------------------------------
# ГОРИЗОНТ
#
# Все величины здесь — **годовые**, если в `unit` не сказано иное. Value
# считается за три года, начиная с периода, следующего за сроком выполнения;
# умножение на горизонт выполняет расчёт, а не справочник. Это решение
# владельца от 2026-08-14: в исходной таблице горизонт применялся
# непоследовательно — в части строк «× 3 года» стояло в пояснении, но в число
# заложено не было.
#
# ---------------------------------------------------------------------------
# ДВЕ ВЕЛИЧИНЫ ПРО ОДНО И ТО ЖЕ
#
# Источники приходили разными порциями и за разные периоды: сводные таблицы
# обоснований ориентированы на 2026 год, квартальные бэклоги ЦИ — на 2024–2025.
# Там, где они описывают одну и ту же величину, действует **более поздняя**
# (решение владельца от 2026-08-21): данные 2025 года могли устареть.
#
# Устаревшая величина не удаляется, а помечается `superseded_by`. Удалить —
# значит потерять возможность воспроизвести расчёты того периода и понять, из
# чего команда исходила. Оставить без пометки — позволить кому-то снова начать
# ей пользоваться.
#
# Действующие пары:
#   routing_annual_effect_3q25_mln  → routing_annual_effect_2026_mln (1.1 → 4.5 млрд)
#   routing_revenue_target_2025_mln → routing_annual_effect_2026_mln
#   rd_annual_estimate_2h2025_mln   → rd_annual_estimate_2026_mln (150 → 300 млн)
#   avg_deal_revenue_rub_per_month  → pretrade_avg_deal_revenue_mln (9 млн/мес → 100 млн)
#   avg_deal_duration_months        → pretrade_avg_deal_revenue_mln
#
# ---------------------------------------------------------------------------
# ЗАМЕНА ОТСУТСТВУЮЩЕГО ДРАЙВЕРА
#
# Если нужного драйвера нет, агент действует по этому порядку и обязан
# записать, каким шагом воспользовался:
#
#   1. Аналог из раздела `substitutions` ниже — если замена явно разрешена
#      методологом. Уверенность понижается на ступень.
#   2. Родственный драйвер той же категории — только когда величины
#      сопоставимы по природе и порядку. Уверенность понижается на ступень.
#   3. Предположение из здравого смысла — уверенность сразу низкая, значение
#      попадает в список того, что нужно уточнить.
#
# Чего делать нельзя: брать произвольный драйвер только потому, что он есть.
# Стоимость минуты ПШЕ вместо стоимости сделки — не замена, а порча расчёта.
# Отсутствие драйвера — нормальный исход: оценка получится широкой, и это
# честнее узкой оценки на подмене.
# ---------------------------------------------------------------------------

version: 2
updated_at: "2026-08-14"

