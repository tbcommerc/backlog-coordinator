  # --- Ставки труда --------------------------------------------------------
  # В обоснованиях команд бюджет ПШЕ встречается в двух значениях, без
  # промежуточных: отношение «млн ₽ ÷ доля ПШЕ» даёт ровно 8.00 в восьми
  # строках и ровно 6.00 в пяти. Словами названо только 6 млн — в задачах
  # «Порядок выхода из PE» (Meth) и «Тех. долг. Автогенерация DEALS-BE» (Post);
  # 8 млн нигде не проговорено и выводится из пары «= X ПШЕ = Y млн».
  #
  # Решение владельца от 2026-08-14: принять 8 млн как более распространённое.
  # Следствие, о котором нужно помнить: пять расчётов, сделанных командой по
  # 6 млн, агент теперь воспроизводить не будет и даст по ним оценку на треть
  # выше. Это цена единой ставки — с двумя ставками сопоставимость оценок между
  # задачами пропадает вовсе.
  fte_annual_budget_rub:
    title: "Бюджет одной ПШЕ в год"
    value: 8000000
    unit: "₽/год"
    category: labour_rates
    source: >-
      Обоснования Post: обеспечения, cap/floor, даты капитализации, комментарий
      в описании, чек-лист, дата погашения — восемь строк с отношением 8.00
    updated_at: "2026-08-14"
    tier: expert

