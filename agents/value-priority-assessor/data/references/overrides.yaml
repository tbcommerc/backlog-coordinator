# Правила-овверрайды (ТЗ v2.0, Ф19). Список настраивается методологом.
#
# Решение владельца от 2026-08-10: дефолтный набор — узкий. Буквальное правило
# из ТЗ («Тип = КВАРТАЛЬНАЯ/ГОДОВАЯ ЦЕЛЬ и срок ≤ 90 дней → P1») оставлено в
# справочнике, но выключено: на реальных данных оно даёт 187 задач из 446 в P1,
# то есть перестаёт что-либо различать. Включается одним флагом enabled: true.
# Обоснование и цифры — docs/DEVIATIONS-FROM-TZ.md.
version: 1
rules:
  - id: regulatory_deadline
    enabled: true
    title: "Регуляторная задача со сроком ≤ 90 дней → P1"
    when:
      is_regulatory: true
      days_to_deadline_lte: 90
    then:
      set_priority: "P1"
    reason: "Регуляторный срок — невыполнение имеет надзорные последствия."

  - id: blocking_flag
    enabled: true
    title: "Задача помечена как блокирующая → P1"
    when:
      is_blocking: true
    then:
      set_priority: "P1"
    reason: "Блокирует другие инициативы трайба."

  - id: tribe_leader_customer
    enabled: true
    title: "Заказчик уровня лидера трайба и выше → минимум P2"
    when:
      customer_level_in: ["tribe_leader"]
    then:
      min_priority: "P2"
    reason: "ТЗ Ф19: прямое поручение лидера трайба или выше."

  - id: tz_quarterly_goal_deadline
    enabled: false
    title: "ТЗ Ф19 буквально: КВАРТАЛЬНАЯ/ГОДОВАЯ ЦЕЛЬ и срок ≤ 90 дней → P1"
    when:
      task_type_in: ["КВАРТАЛЬНАЯ/ГОДОВАЯ ЦЕЛЬ"]
      days_to_deadline_lte: 90
    then:
      set_priority: "P1"
    reason: "Плановая цель квартала с наступающим сроком."

# Признаки, по которым вычисляются условия правил.
detection:
  regulatory_keywords:
    - "регулятор"
    - "цб рф"
    - "банк россии"
    - "предписан"
    - "надзор"
    - "комплаенс"
    - "115-фз"
    - "нормативн"
  rnd_keywords:
    - "l2p"
    - "rnd"
    - "r&d"
    - "ниокр"
    - "исследование"
    - "пилот"
    - "гипотез"
  blocking_keywords:
    - "блокир"
    - "критичн"
    - "инцидент"
    - "прод не работает"
