# Справочник уровней бизнес-заказчика — фактор F2, вес 0.15.
#
# ЗАПОЛНЯЕТ МЕТОДОЛОГ. Соответствия «ФИО → уровень» нет ни в бэклоге, ни в ТЗ,
# и агент его не выдумывает: угадывать уровень по фамилии означало бы внести в
# методику ровно тот произвол, против которого она написана.
#
# Пока у всех стоит `unknown`, фактор даёт одинаковые 0.075 каждой задаче и на
# порядок задач не влияет — 15% веса модели простаивает. Заполнять можно
# постепенно: список отсортирован по числу задач, поэтому первые двадцать строк
# закрывают большую часть бэклога.
#
# ---------------------------------------------------------------------------
# КАК ЗАПОЛНЯТЬ
#
# Замените `unknown` на один из уровней ниже:
#
#   tribe_leader — лидер трайба и выше; даёт минимум P2 независимо от скора;
#   director     — директор направления или региональный директор;
#   head         — руководитель команды или продукта;
#   team         — внутренний заказчик уровня команды.
#
# Оставленный `unknown` — не ошибка, а честное «не знаю»: нейтральный балл 0.5.
#
# ---------------------------------------------------------------------------
# КАК АГЕНТ ИЩЕТ УРОВЕНЬ
#
#   1. Из значения поля «Бизнес-заказчик» извлекаются все ФИО. Строка
#      «М. Первак Д. Фомин Д. Козлов Ю. Шилов» — это четыре человека, и каждый
#      ищется в разделе `customers` отдельно. Берётся САМЫЙ ВЫСОКИЙ из найденных
#      уровней: заявка, под которой стоит директор, не становится менее весомой
#      оттого, что рядом расписались ещё трое.
#   2. Если ФИО в строке нет, значение ищется в разделе `groups` — там
#      коллективные заказчики вроде «УСИ (общая)».
#   3. Если не нашлось и там, берётся подразделение из раздела `divisions`,
#      тоже с разбором составных значений и выбором старшего уровня.
#   4. Иначе — `default_level`.
#
# Латинские буквы, подставленные вместо кириллических, приводятся к кириллице:
# «C. Фидаров» и «С. Фидаров» — один человек, писать обе строки не нужно.
# ---------------------------------------------------------------------------

version: 2
updated_at: "2026-08-14"
default_level: unknown

levels:
  tribe_leader:
    score: 1.0
    title: "Лидер трайба и выше (член правления, CEO)"
    min_priority: "P2"   # ТЗ Ф19: минимум P2 вне зависимости от скора
  director:
    score: 0.8
    title: "Директор направления / региональный директор"
  head:
    score: 0.5
    title: "Руководитель команды или продукта"
  team:
    score: 0.2
    title: "Внутренний заказчик уровня команды"
  unknown:
    score: 0.5
    title: "Уровень не определён — нейтральный вклад"

