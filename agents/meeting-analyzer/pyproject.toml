[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dmb-meeting-analyzer"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["dmb-agent-contracts==1.4.1", "fastapi>=0.109,<1", "uvicorn>=0.27,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.1,<3"]

[tool.setuptools.packages.find]
include = ["meeting_analyzer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
