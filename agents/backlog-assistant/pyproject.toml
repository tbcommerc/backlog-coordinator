[project]
name = "backlog-assistant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.109.0", "uvicorn==0.27.0", "pydantic==2.5.3",
  "sqlalchemy==2.0.25", "psycopg[binary]==3.2.9", "httpx==0.27.2",
  "jsonschema==4.23.0",
]

[project.optional-dependencies]
test = ["pytest==8.3.5", "pytest-asyncio==0.25.3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backlog_assistant*", "runtime*", "bridge*", "fixtures*", "contracts*"]

[tool.setuptools.package-data]
contracts = ["*.json"]
runtime = ["*.txt"]
