name: Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backlog backend / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dmb-backlog/backend
    env:
      DEBUG: "true"
      RUN_STARTUP_SEED: "false"
      RUN_STARTUP_MAINTENANCE: "false"
      RUN_NOTIFICATION_SCHEDULER: "false"
      DATABASE_URL: sqlite:///./ci-test.db
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dmb-backlog/backend/requirements-dev.lock
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.lock
      - name: Compile backend
        run: python -m compileall -q .
      - name: Run backend tests
        run: python -m pytest tests -q -p no:cacheprovider

  frontend:
    name: Backlog frontend / Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dmb-backlog
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        shell: bash
        run: find frontend/js frontend/tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Run frontend tests
        run: node --test frontend/tests/*.test.mjs

  frontend-e2e:
    name: Backlog frontend / Playwright Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dmb-backlog
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dmb-backlog/package-lock.json
      - name: Install frontend test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser notification tests
        run: npm run test:e2e

  ba-agent:
    name: BA agent / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent
    env:
      LLM_PROVIDER: mock
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements-dev.lock
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.lock
      - name: Compile agent
        run: python -m compileall -q agent
      - name: Run agent tests
        run: python -m pytest agent/tests -q -p no:cacheprovider

  prioritiser:
    name: Prioritiser / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: prioritiser-agent
    env:
      PRIORITISER_LLM_PROVIDER: mock
      PRIORITISER_STRATEGY_PROVIDER: stub
      PRIORITISER_RAG_LOCAL_FILES_ONLY: "false"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: prioritiser-agent/requirements.lock
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
      - name: Compile prioritiser
        run: python -m compileall -q app
      - name: Run prioritiser tests
        run: python -m pytest tests -q -p no:cacheprovider

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install audit tool
        run: python -m pip install --disable-pip-version-check pip-audit==2.7.3
      - name: Audit pinned direct dependencies
        run: |
          python -m pip_audit -r dmb-backlog/backend/requirements.txt --no-deps
          python -m pip_audit -r agent/requirements.txt --no-deps
          python -m pip_audit -r prioritiser-agent/requirements.txt --no-deps
