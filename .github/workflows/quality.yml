name: Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backlog backend / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dmb-backlog/backend
    env:
      DEBUG: "true"
      RUN_STARTUP_SEED: "false"
      RUN_STARTUP_MAINTENANCE: "false"
      RUN_NOTIFICATION_SCHEDULER: "false"
      DATABASE_URL: sqlite:///./ci-test.db
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dmb-backlog/backend/requirements-dev.lock
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.lock
      - name: Compile backend
        run: python -m compileall -q .
      - name: Run backend tests
        run: python -m pytest tests -q -p no:cacheprovider

  backend-isolated:
    name: Backend isolated / ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: accounts
            command: python -m pytest account_tests -q -p no:cacheprovider --confcutdir=account_tests
          - suite: customer-result
            command: python -m pytest customer_result_tests -q -p no:cacheprovider --confcutdir=customer_result_tests
          - suite: customer-queue
            command: python -m pytest customer_queue_tests -q -p no:cacheprovider --confcutdir=customer_queue_tests
          - suite: work
            command: python -m pytest work_tests -q -p no:cacheprovider --confcutdir=work_tests
          - suite: backlog-assistant-integration
            command: python -m pytest backlog_assistant_tests -q -p no:cacheprovider --confcutdir=backlog_assistant_tests
          - suite: admin_empty_dictionary
            command: python -B tests/admin_empty_dictionary_contracts.py
          - suite: import_customer
            command: python -B tests/import_customer_contracts.py
          - suite: import_header
            command: python -B tests/import_header_contracts.py
          - suite: import_validation
            command: python -B tests/import_validation_contracts.py
          - suite: notification_review
            command: python -B tests/notification_review_contracts.py
          - suite: p1_validation
            command: python -B tests/p1_validation_contracts.py
    defaults:
      run:
        working-directory: dmb-backlog/backend
    env:
      DEBUG: "true"
      DATABASE_URL: "sqlite:///:memory:"
      RUN_STARTUP_SEED: "false"
      RUN_STARTUP_MAINTENANCE: "false"
      RUN_NOTIFICATION_SCHEDULER: "false"
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dmb-backlog/backend/requirements-dev.lock
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.lock
      - name: Run isolated suite (no shared tests/conftest.py)
        run: ${{ matrix.command }}

  agent-v2:
    name: Agent V2 / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent-v2
    env:
      AGENT_V2_SESSION_DATABASE_URL: "sqlite:///:memory:"
      AGENT_V2_LLM_PROVIDER: mock
      AGENT_V2_MCP_SERVERS_JSON: "[]"
      AGENT_V2_TOOLS_CONFIG_JSON: "[]"
      AGENT_V2_OTEL_ENABLED: "false"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent-v2/requirements-dev.lock
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.lock
      - name: Run isolated Agent V2 tests
        run: python -m pytest agent_v2/tests -q -p no:cacheprovider --confcutdir=agent_v2/tests

  backlog-assistant:
    name: Backlog Assistant / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backlog-assistant
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backlog-assistant/requirements.lock
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock
      - name: Run isolated service tests (exclude live probe scripts)
        run: python -m pytest tests -q -p no:cacheprovider -p pytest_asyncio.plugin --confcutdir=tests

  frontend:
    name: Backlog frontend / Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dmb-backlog
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        shell: bash
        run: find frontend/js frontend/tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Run frontend tests
        run: node --test frontend/tests/*.test.mjs

  frontend-e2e:
    name: Backlog frontend / Playwright Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dmb-backlog
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dmb-backlog/package-lock.json
      - name: Install frontend test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser notification tests
        run: npm run test:e2e

  ba-agent:
    name: BA agent / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent
    env:
      LLM_PROVIDER: mock
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements-dev.lock
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.lock
      - name: Compile agent
        run: python -m compileall -q agent
      - name: Run agent tests
        run: python -m pytest agent/tests -q -p no:cacheprovider

  prioritiser:
    name: Prioritiser / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: prioritiser-agent
    env:
      PRIORITISER_LLM_PROVIDER: mock
      PRIORITISER_STRATEGY_PROVIDER: stub
      PRIORITISER_RAG_LOCAL_FILES_ONLY: "false"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: prioritiser-agent/requirements.lock
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
      - name: Compile prioritiser
        run: python -m compileall -q app
      - name: Run prioritiser tests
        run: python -m pytest tests -q -p no:cacheprovider

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install audit tool
        run: python -m pip install --disable-pip-version-check pip-audit==2.7.3
      - name: Audit pinned direct dependencies
        run: |
          python -m pip_audit -r dmb-backlog/backend/requirements.txt --no-deps
          python -m pip_audit -r agent/requirements.txt --no-deps
          python -m pip_audit -r prioritiser-agent/requirements.txt --no-deps
