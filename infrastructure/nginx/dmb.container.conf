resolver 127.0.0.11 valid=10s ipv6=off;

# The HTTP listener is loopback/private behind the trusted TLS ingress.
# That ingress must overwrite X-Forwarded-Proto from external clients.
map $http_x_forwarded_proto $dmb_forwarded_proto {
    default $scheme;
    https https;
    http http;
}

upstream dmb_backend {
    zone dmb_backend 64k;
    least_conn;
    server backend:8000 resolve;
    keepalive 64;
}

server {
    listen 8080;
    server_name _;
    client_max_body_size 52m;
    add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /api/v1/events/stream {
        proxy_pass http://dmb_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $dmb_forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        add_header X-Accel-Buffering no always;
        add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location / {
        proxy_pass http://dmb_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $dmb_forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 190s;
    }

    location = /metrics {
        return 404;
    }
}
