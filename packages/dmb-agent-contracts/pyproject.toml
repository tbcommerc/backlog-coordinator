[build-system]
requires = ["setuptools==75.8.2", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "dmb-agent-contracts"
version = "1.4.1"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5,<3", "python-dotenv>=1,<2"]

[project.optional-dependencies]
transport = ["httpx>=0.27,<1", "jsonschema>=4.23,<5"]
service = ["httpx>=0.27,<1", "jsonschema>=4.23,<5", "fastapi>=0.109,<1", "sqlalchemy>=2,<3"]

[tool.setuptools.packages.find]
include = ["dmb_agent_contracts*"]

[tool.setuptools.package-data]
dmb_agent_contracts = ["reference/*.json", "profiles.json"]
