if(a==='edit')startEdit();
else if(a==='save')saveEdit();
else if(a==='cancel')cancelEdit();
else if(a==='close')closeModal();
else if(a==='copy-id'){try{navigator.clipboard.writeText(String(task.id));toast('ID '+task.id+' скопирован','ok');}catch(e){toast('ID: '+task.id,'ok');}}
else if(a==='mention')applyMention(act.dataset.name);
else if(a==='ai-calc'){aiSugg=aiSuggest();var pop=document.getElementById('aiPop');
if(pop){pop.innerHTML='<div class="ah">'+ic('spark')+'AI-подсказка</div><div class="av">Финансовый эффект: '+fmtNum(aiSugg.fin,1)+' млн ₽</div><div class="at">'+esc(aiSugg.text)+'</div><div style="display:flex;gap:8px"><button class="btn primary mini" data-action="ai-apply">'+ic('check')+'Применить</button><button class="btn ghost mini" data-action="ai-dismiss">Скрыть</button></div>';pop.classList.add('show');}}
else if(a==='ai-apply')applyAI();
else if(a==='ai-dismiss'){aiSugg=null;var p1=document.getElementById('aiPop');if(p1)p1.classList.remove('show');}
else if(a==='ps-calc'){psSugg=psSuggest();var pop2=document.getElementById('psPop');
if(pop2){pop2.innerHTML='<div class="ah">'+ic('spark')+'Расчёт агента</div><div class="av">Priority Score: '+psSugg.score+'/100</div><div class="at">'+esc(psSugg.text)+'</div><div style="display:flex;gap:8px"><button class="btn primary mini" data-action="ps-apply">'+ic('check')+'Применить</button><button class="btn ghost mini" data-action="ps-dismiss">Скрыть</button></div>';pop2.classList.add('show');}}
else if(a==='ps-apply')applyPS();
else if(a==='ps-dismiss'){psSugg=null;var p2=document.getElementById('psPop');if(p2)p2.classList.remove('show');}
else if(a==='reply'){state.replyFor=+act.dataset.cid;renderBody();}
else if(a==='reply-cancel'){state.replyFor=null;renderBody();}
else if(a==='send-comment'){var box=document.getElementById('commentBox');if(box&&box.value.trim()){task.comments.push({id:Date.now(),author:CURRENT_USER,at:nowLocal(),text:box.value.trim(),replies:[]});renderBody();toast('Комментарий добавлен','ok');}else toast('Комментарий пуст','err');}
else if(a==='send-reply'){var box2=document.getElementById('replyBox');var c=task.comments.find(function(x){return x.id===+act.dataset.cid;});if(box2&&box2.value.trim()&&c){c.replies.push({id:Date.now(),author:CURRENT_USER,at:nowLocal(),text:box2.value.trim()});state.replyFor=null;renderBody();toast('Ответ добавлен','ok');}else toast('Ответ пуст','err');}
else if(a==='add-jira'){var inp=document.getElementById('newJira');if(inp&&inp.value.trim()){if(!urlOk(inp.value.trim())){toast('Некорректная ссылка Jira','err');return;}state.draft.jiraLinks.push(inp.value.trim());state.dirty=true;renderBody();updateDirty();}}
else if(a==='del-jira'){state.draft.jiraLinks.splice(+act.dataset.idx,1);state.dirty=true;renderBody();updateDirty();}
else if(a==='add-req'){var inp2=document.getElementById('newReq');if(inp2&&inp2.value.trim()){if(!urlOk(inp2.value.trim())){toast('Некорректная ссылка на требования','err');return;}state.draft.reqLinks.push(inp2.value.trim());state.dirty=true;renderBody();updateDirty();}}
else if(a==='del-req'){state.draft.reqLinks.splice(+act.dataset.idx,1);state.dirty=true;renderBody();updateDirty();}
return;}
var tab=ev.target.closest('[data-tab]');
if(tab){state.tab=tab.dataset.tab;state.replyFor=null;renderTabs();renderBody();return;}
var chip=ev.target.closest('[data-toggle]');
if(chip&&state.editing){var field=chip.dataset.toggle,val=chip.dataset.val;var arr=state.draft[field],i=arr.indexOf(val);if(i>=0)arr.splice(i,1);else arr.push(val);state.dirty=true;renderBody();updateDirty();refreshDynamic();return;}});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});
$('#overlay').addEventListener('mousedown',function(e){if(e.target.id==='overlay')closeModal();});
function closeModal(){if(state.dirty||state.editing){toast('Сохраните или отмените изменения, чтобы закрыть карточку','warn');return;}$('#overlay').classList.remove('show');}
var toastT;function toast(msg,type){var t=$('#toast');t.className='toast show';t.innerHTML=ic((type==='ok')?'check':'alert')+'<span>'+esc(msg)+'</span>';clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show');},2800);}
try{render();}catch(err){var mb=document.getElementById('mbody');if(mb)mb.innerHTML='<div class="errbox">Ошибка рендера: '+esc(err.message)+'</div>';}
</script></body></html>
