<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Бэклог — карточка задачи v30</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/inter@latest/index.css">
<style>
:root{
  --bg:#F4F6F8;
  --surface:#FFFFFF;
  --body:#F8FAFC;
  --ink:#0F172A;
  --muted:#5B6B7F;
  --faint:#64748B;
  --line:#E5EAF0;
  --line2:#D3DDE6;
  --accent:#16A34A;
  --accent-h:#15803D;
  --accent-soft:#EAFBF0;
  --ring:rgba(22,163,74,.16);
  --info:#2563EB;
  --info-bg:#EFF4FF;
  --warn:#B45309;
  --warn-bg:#FFF7E6;
  --danger:#DC2626;
  --danger-bg:#FEECEC;
  --violet:#7C3AED;
  --violet-bg:#F3EEFF;
  --ai:#7C3AED;
}

*{box-sizing:border-box;margin:0;padding:0}
body{
  font:14px/1.45 'Inter',system-ui,sans-serif;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
button{font-family:inherit;cursor:pointer}
svg{width:14px;height:14px;flex:none}

button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible,
a:focus-visible,
.chip:focus-visible,
.tab:focus-visible,
summary:focus-visible{
  outline:2px solid var(--info);
  outline-offset:2px;
}

.overlay{
  position:fixed;
  top:0;left:0;right:0;bottom:0;
  background:rgba(15,23,42,.45);
  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:50;
  padding:20px;
}
.overlay.hidden{display:none}

.modal{
  position:relative;
  width:100%;
  max-width:1280px;
  height:100%;
  max-height:960px;
  background:var(--surface);
  border-radius:16px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  box-shadow:0 32px 64px -16px rgba(15,23,42,.28);
}
.modal::before{
  content:'';
  position:absolute;
  top:0;left:0;right:0;
  height:4px;
  background:linear-gradient(90deg,var(--accent),#22C55E 45%,var(--violet));
  z-index:3;
}
.modal.editing{
  box-shadow:0 0 0 3px var(--ring),0 32px 64px -16px rgba(15,23,42,.28);
}

.mhead{
  padding:12px 20px;
  border-bottom:1px solid var(--line);
  background:var(--surface);
  flex:0 0 auto;
}
.head-row1{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}
.row-badges{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
}
.row-status{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
}
.row-actions{
  display:flex;
  gap:6px;
  align-items:center;
}
.head-title{
  margin-top:8px;
  font-size:16px;
  font-weight:800;
  letter-spacing:-.01em;
  line-height:1.3;
  color:var(--ink);
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  word-break:break-word;
}

.tid{
  border:1px solid var(--line);
  background:#F1F5F9;
  border-radius:9px;
  padding:4px 9px;
  font-size:12px;
  font-weight:700;
  color:var(--muted);
  display:inline-flex;
  gap:6px;
  align-items:center;
  font-variant-numeric:tabular-nums;
  transition:.15s;
}
.tid:hover{border-color:var(--line2);color:var(--ink)}
.tid svg{width:12px;height:12px}

.ttype{
  background:var(--violet-bg);
  color:var(--violet);
  border-radius:8px;
  padding:4px 10px;
  font-size:11px;
  font-weight:700;
  letter-spacing:.03em;
}

.editbadge{
  background:var(--warn-bg);
  color:var(--warn);
  border-radius:999px;
  padding:4px 12px;
  font-size:11px;
  font-weight:700;
}

.iconbtn{
  border:none;
  background:#F1F5F9;
  border-radius:9px;
  width:30px;
  height:30px;
  color:var(--muted);
  display:inline-flex;
  align-items:center;
  justify-content:center;
  transition:.15s;
}
.iconbtn:hover{background:var(--line);color:var(--ink)}

.pill{
  display:inline-flex;
  align-items:center;
  border-radius:999px;
  padding:4px 11px;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
}
.pill.status::before{
  content:'';
  width:6px;height:6px;
  border-radius:50%;
  background:currentColor;
  margin-right:6px;
}
.pill.priority{
  background:transparent;
  border:1px solid currentColor;
  padding:3px 10px;
}

.b-gray{background:#EEF2F6;color:#526073}
.b-blue{background:var(--info-bg);color:var(--info)}
.b-green{background:var(--accent-soft);color:var(--accent-h)}
.b-red{background:var(--danger-bg);color:var(--danger)}
.b-amber{background:var(--warn-bg);color:var(--warn)}
.b-violet{background:var(--violet-bg);color:var(--violet)}

.prio-high{color:var(--danger)}
.prio-mid{color:var(--warn)}
.prio-low{color:var(--accent-h)}

.g-a{background:linear-gradient(135deg,#15803D,#4ADE80);color:#fff}
.g-b{background:var(--accent-soft);color:var(--accent-h)}
.g-c{background:var(--info-bg);color:var(--info)}
.g-d{background:var(--warn-bg);color:var(--warn)}
.g-e{background:var(--danger-bg);color:var(--danger)}

.tabs{
  display:flex;
  gap:18px;
  padding:0 20px;
  border-bottom:1px solid var(--line);
  background:var(--surface);
  overflow-x:auto;
  position:relative;
  flex:0 0 auto;
}
.tab{
  border:none;
  background:none;
  padding:10px 2px 9px;
  font-size:12.5px;
  font-weight:600;
  color:var(--muted);
  display:inline-flex;
  gap:8px;
  align-items:center;
  white-space:nowrap;
  transition:color .15s;
}
.tab svg{width:14px;height:14px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);font-weight:700}
.tab-count{
  background:#EEF2F6;
  color:var(--muted);
  padding:1px 7px;
  border-radius:99px;
  font-size:11px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.tab.on .tab-count{
  background:var(--accent-soft);
  color:var(--accent-h);
}
#tabInd{
  position:absolute;
  bottom:-1px;
  height:2px;
  background:var(--accent);
  border-radius:2px;
  transition:left .25s,width .25s;
}

.mbody{
  flex:1 1 auto;
  overflow:auto;
  background:var(--body);
  padding:14px 20px 18px;
}
.mbody::-webkit-scrollbar{width:10px}
.mbody::-webkit-scrollbar-thumb{
  background:var(--line2);
  border-radius:8px;
  border:3px solid var(--body);
}

.task-top{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-bottom:14px;
}
.task-title-row{
  display:flex;
  align-items:center;
  gap:10px;
}
.task-title{
  font-size:24px;
  font-weight:800;
  letter-spacing:-.03em;
  line-height:1.2;
  word-break:break-word;
}
.title-edit-wrap{
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
}
.title-input{
  width:100%;
  font-size:20px;
  font-weight:800;
  letter-spacing:-.02em;
  border:1.5px solid var(--accent);
  border-radius:10px;
  padding:8px 12px;
  outline:none;
  font-family:inherit;
  box-shadow:0 0 0 3px var(--ring);
}
.tcount{
  font-size:11px;
  color:var(--faint);
  font-variant-numeric:tabular-nums;
  flex:none;
}
.task-desc{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px 14px;
}
.desc-label{
  font-size:10.5px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:var(--faint);
  margin-bottom:6px;
}
.task-desc textarea{
  min-height:84px;
}
.task-desc .txt{
  color:#33415C;
  font-size:13.5px;
  line-height:1.55;
}

.sec{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:11px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.09em;
  color:var(--muted);
  margin:16px 0 8px;
}
.sec:first-child{margin-top:2px}
.sec .sic{
  width:22px;
  height:22px;
  border-radius:8px;
  background:#EEF2F6;
  color:var(--muted);
  display:inline-flex;
  align-items:center;
  justify-content:center;
}
.sec .sic svg{width:13px;height:13px}
.sec::after{
  content:'';
  flex:1;
  height:1px;
  background:var(--line);
}

.bento{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  align-items:stretch;
}
.cl{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px 14px;
  min-width:0;
  display:flex;
  flex-direction:column;
  transition:border-color .15s;
}
.cl:hover{border-color:var(--line2)}
.cl.sp3{grid-column:1/-1}
.cl.half{
  height:100%;
  min-height:168px;
}

.cl-h{
  display:flex;
  gap:8px;
  align-items:center;
  font-size:10.5px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:var(--faint);
  margin-bottom:8px;
}
.cl-h svg{width:13px;height:13px;color:var(--muted)}

.cl-grid{
  display:grid;
  gap:10px 12px;
}
.cl-grid.exec{
  grid-template-columns:
    minmax(160px,1.15fr)
    minmax(120px,.85fr)
    minmax(130px,.9fr)
    minmax(240px,1.6fr);
}
.cl-grid.classify{
  grid-template-columns:1.3fr .7fr 1.7fr;
  align-items:start;
}
.cl-grid.duo{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px 12px;
  height:100%;
  grid-template-rows:auto minmax(56px,1fr);
  align-content:stretch;
}
.cl-grid.duo .icell{min-width:0}
.span2cell{grid-column:span 2}
.cl-grid.duo .span2cell{grid-column:1/-1}

.ilab{
  font-size:10px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.06em;
  color:var(--faint);
  margin-bottom:3px;
  display:flex;
  gap:6px;
  align-items:center;
}
.ilab .flt{flex:1;min-width:0}
.ilab .lk{
  flex:none;
  display:inline-flex;
  color:var(--faint);
}
.ilab .lk svg{width:11px;height:11px}

.ival{
  font-size:13px;
  font-weight:600;
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  min-height:22px;
}
.ival .txt{color:#33415C;font-weight:500}
.ival select,
.ival input[type=text],
.ival input[type=number],
.ival input[type=date]{
  flex:1;
  min-width:0;
  background:#F8FAFC;
  border:1px solid var(--line);
}
.ival select:hover,
.ival input:hover{border-color:var(--line2)}

.cl-grid.duo .ival{align-items:center}
.cl-grid.duo .ival.person-cell,
.cl-grid.duo .span2cell .ival{align-items:flex-start}

.person-cell{
  align-items:flex-start;
  width:100%;
}
.person-controls{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:4px;
  justify-content:flex-start;
}
.person-name{font-weight:600}
.person-sub{
  font-size:11px;
  color:var(--faint);
  font-weight:600;
}
.grade-wrap{
  display:inline-flex;
  align-items:center;
  gap:6px;
  margin-right:10px;
}
.grades{flex-wrap:wrap}

.vchip{
  display:inline-flex;
  gap:8px;
  align-items:center;
  font-weight:600;
}
.vchip svg{width:14px;height:14px;color:var(--faint)}

.pbar2{
  display:inline-block;
  width:55%;
  height:6px;
  background:var(--line);
  border-radius:99px;
  overflow:hidden;
  vertical-align:middle;
  margin-right:9px;
}
.pbar2 span{
  display:block;
  height:100%;
  background:var(--accent);
  border-radius:99px;
}

input[type=text],
input[type=number],
input[type=date],
input[type=datetime-local],
input[type=url],
select,
textarea{
  width:100%;
  border:1px solid var(--line);
  border-radius:9px;
  padding:6px 9px;
  font-family:inherit;
  font-size:12.5px;
  font-weight:500;
  background:#fff;
  outline:none;
  color:var(--ink);
  transition:border-color .15s,box-shadow .15s;
}
input:focus,
select:focus,
textarea:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--ring);
  background:#fff;
}
textarea{resize:vertical;line-height:1.45}
input[type=range]{
  flex:1;
  min-width:70px;
  accent-color:var(--accent);
  border:none;
  padding:0;
  box-shadow:none;
}
.pnum{width:60px;flex:none}
.prog-edit{
  display:flex;
  align-items:center;
  gap:8px;
  width:100%;
}

.chips{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  align-items:center;
}
.chip{
  border:1px solid var(--line);
  background:#F8FAFC;
  border-radius:999px;
  padding:4px 11px;
  font-size:12px;
  font-weight:600;
  color:var(--muted);
  display:inline-flex;
  align-items:center;
  gap:6px;
  transition:.15s;
}
.chip svg{width:12px;height:12px;color:var(--faint)}
.chip:hover{border-color:var(--line2);color:var(--ink)}
.chip.on{
  background:var(--accent-soft);
  border-color:var(--accent);
  color:var(--accent-h);
}
.chip.on svg{color:var(--accent)}
.chip.static{cursor:default}

.chip-add{
  width:auto;
  min-width:130px;
  border:1px dashed var(--line2);
  background:#F8FAFC;
  border-radius:999px;
  padding:4px 10px;
  font-size:12px;
  font-weight:600;
  color:var(--muted);
}
.chips.compact{
  max-height:56px;
  overflow:auto;
  align-items:flex-start;
  align-content:flex-start;
  padding-right:4px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.span2{grid-column:1/-1}

.field{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:12px;
  padding:9px 11px;
  transition:border-color .15s,box-shadow .15s;
}
.field:hover{border-color:var(--line2)}
.field:focus-within{
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--ring);
}
.flabel,
.kl{
  font-size:10.5px;
  font-weight:600;
  color:var(--muted);
  margin-bottom:4px;
  display:flex;
  gap:6px;
  align-items:center;
}
.flt{flex:1;min-width:0}
.lk{
  flex:none;
  display:inline-flex;
  color:var(--faint);
}
.lk svg{width:12px;height:12px}
.fval{
  font-weight:600;
  font-size:13px;
  word-break:break-word;
}
.fval .txt{color:#33415C;font-weight:500}
.fval a{
  color:var(--info);
  text-decoration:none;
  display:inline-flex;
  gap:7px;
  align-items:center;
  word-break:break-all;
  font-weight:600;
}
.fval a:hover{text-decoration:underline}
.fval a svg{width:13px;height:13px}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  overflow:hidden;
  margin-bottom:10px;
}
.stats-half{
  padding:12px 14px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}
.stats-half+.stats-half{border-left:1px solid var(--line)}
.stats-title{
  grid-column:1/-1;
  font-size:10.5px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:var(--faint);
}
.stat .slab{
  font-size:10.5px;
  font-weight:600;
  color:var(--muted);
  margin-bottom:2px;
  display:flex;
  gap:5px;
  align-items:center;
}
.stat .slab svg{width:11px;height:11px;color:var(--faint)}
.sval{
  font-size:15px;
  font-weight:800;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.01em;
}
.sval small{
  font-size:10.5px;
  color:var(--faint);
  font-weight:600;
}

.psrow{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  align-items:start;
}
.bigcard{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px 14px;
  display:flex;
  flex-direction:column;
  min-width:0;
}
.bc-head{
  display:flex;
  align-items:center;
  gap:8px;
}
.bc-title{
  font-size:11px;
  font-weight:800;
  letter-spacing:.02em;
  text-transform:uppercase;
  color:var(--muted);
}
.bc-head .btn.ai{margin-left:auto}
.bc-value{
  font-size:22px;
  font-weight:800;
  letter-spacing:-.02em;
  margin-top:6px;
  font-variant-numeric:tabular-nums;
}
.bc-value small{
  font-size:12px;
  color:var(--faint);
  font-weight:600;
  letter-spacing:0;
}
.psbar{
  margin-top:8px;
  width:100%;
  height:6px;
  background:var(--line);
  border-radius:99px;
  overflow:hidden;
}
.psbar span{
  display:block;
  height:100%;
  border-radius:99px;
  background:linear-gradient(90deg,var(--accent),#4ADE80);
}
.psbar.hide{visibility:hidden}
.bc-div{
  height:1px;
  background:var(--line);
  margin:10px 0 8px;
}
.jlab{
  font-size:10.5px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.07em;
  color:var(--faint);
  margin-bottom:3px;
}
.jtxt{
  font-size:12px;
  color:#334155;
  line-height:1.45;
}
.cv-good{color:var(--accent-h)}
.cv-warn{color:var(--warn)}
.cv-bad{color:var(--danger)}

.jdetails{margin:0}
.jdetails summary{
  cursor:pointer;
  list-style:none;
  display:flex;
  align-items:center;
  gap:6px;
  font-size:10.5px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.07em;
  color:var(--faint);
}
.jdetails summary::-webkit-details-marker{display:none}
.jdetails summary::before{
  content:'›';
  font-size:12px;
  transform:rotate(90deg);
  transition:transform .15s;
}
.jdetails[open] summary::before{
  transform:rotate(0deg);
}
.jdetails .jtxt{margin-top:5px}
.prevdetails{
  margin-top:6px;
  border-top:1px dashed var(--line);
  padding-top:6px;
}
.prevdetails summary{
  cursor:pointer;
  font-size:11px;
  font-weight:700;
  color:var(--muted);
}

.btn.ai{
  border:1px solid var(--violet-bg);
  background:var(--surface);
  color:var(--ai);
  height:26px;
  padding:0 10px;
  font-size:11.5px;
  font-weight:700;
  border-radius:8px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  transition:.15s;
}
.btn.ai:hover{
  background:var(--violet-bg);
  border-color:var(--violet-bg);
}

.aipop{
  display:none;
  margin-top:10px;
  border:1px solid #DDD3FF;
  background:var(--violet-bg);
  border-radius:10px;
  padding:10px 12px;
}
.aipop.show{display:block}
.aipop .ah{
  font-size:11px;
  font-weight:800;
  text-transform:uppercase;
  color:var(--violet);
  margin-bottom:5px;
  display:flex;
  gap:6px;
  align-items:center;
}
.aipop .av{
  font-size:14px;
  font-weight:800;
  margin-bottom:4px;
}
.aipop .at{
  font-size:12.5px;
  color:#334155;
  font-weight:500;

function calcCost(o){
  var s = 0;
  var a = false;
  ROLES.forEach(function(r){
    var v = +o[r.key];
    if(v){
      a = true;
      s += v * RATES[r.key];
    }
  });
  return a ? s : null;
}

function calcSum(o){
  var s = 0;
  var a = false;
  ROLES.forEach(function(r){
    var v = +o[r.key];
    if(v){
      a = true;
      s += v;
    }
  });
  return a ? Math.round(s * 100) / 100 : null;
}

function cvCalc(cost,fin){
  return (cost > 0 && fin != null && fin > 0) ? Math.round(cost / (fin * 1e6) * 100) / 100 : null;
}

function cvCls(v){
  if(v == null) return '';
  return v < 0.3 ? 'cv-good' : (v <= 1 ? 'cv-warn' : 'cv-bad');
}

function psCls(v){
  if(v == null) return '';
  return v >= 70 ? 'cv-good' : (v >= 40 ? 'cv-warn' : 'cv-bad');
}

function diffPct(eo,ftz){
  if(eo == null || eo === 0 || eo === '') return {txt:'—', cls:'d-neutral'};
  if(ftz == null || ftz === '') return {txt:'—', cls:'d-neutral'};
  var p = Math.round((ftz - eo) / eo * 100);
  if(p < 0) return {txt:p + '%', cls:'d-good'};
  if(p > 0) return {txt:'+' + p + '%', cls:'d-bad'};
  return {txt:'0%', cls:'d-neutral'};
}

function statusCls(s){
  if(s === 'ВЫПОЛНЕНА') return 'b-green';
  if(s === 'ОТКЛОНЕНА' || s === 'НЕ АКТУАЛЬНА' || s === 'ЭСКАЛАЦИЯ НА ЛТ') return 'b-red';
  if(s === 'ХОЛД' || s === 'ПРИНЯТИЕ РЕШЕНИЯ' || s === 'ЭКСПРЕСС-ОЦЕНКА') return 'b-amber';
  if(s === 'НОВАЯ ЗАДАЧА') return 'b-gray';
  return 'b-blue';
}

function statusHex(s){
  var c = statusCls(s);
  return c === 'b-green' ? '#16A34A' : c === 'b-blue' ? '#2563EB' : c === 'b-amber' ? '#D97706' : c === 'b-red' ? '#DC2626' : '#94A3B8';
}

function aiSuggest(){
  var t = cur();
  var cost = calcCost(t.eo) || 0;
  var fin = Math.round(cost / 0.25 / 1e6 * 10) / 10;

  var text = 'AI-оценка: стоимость по ЭО ' + fmtMoney(cost) +
    ' при целевом C/V 0,25 даёт финансовый эффект ' + fmtNum(fin,1) +
    ' млн ₽. Учтены ответственная команда ' + t.team +
    (t.otherTeams.length ? ', вовлечённые команды: ' + t.otherTeams.join(', ') : '') +
    ', срок ' + t.deadline + ' и медианные эффекты аналогичных задач портфеля.';

  return {fin:fin, text:text};
}

function psSuggest(){
  var t = cur();
  var cost = calcCost(t.eo);
  var cvE = cvCalc(cost,t.finEffect);
  var s = 0;

  s += t.priority === 'ВЫСОКИЙ' ? 40 : (t.priority === 'СРЕДНИЙ' ? 25 : 10);
  s += Math.min(30, Math.round((t.finEffect || 0) * 2));
  s += cvE == null ? 0 : (cvE < 0.3 ? 20 : (cvE <= 1 ? 10 : 0));
  s += t.deadline === 'БЕЗ СРОКА' ? 0 : 10;
  s = Math.min(100, s);

  var text = 'Агент учёл: приоритет «' + t.priority + '», финансовый эффект ' +
    fmtNum(t.finEffect,2) + ' млн ₽, C/V по ЭО ' +
    (cvE == null ? '—' : cvE.toLocaleString('ru-RU')) +
    ', срок «' + t.deadline + '», принадлежность к проекту «' + t.project + '». Итог: ' + s + '/100.';

  return {score:s, text:text};
}

function effortTable(t,e){
  var rows = '';

  ROLES.forEach(function(r){
    var eoV = t.eo[r.key];
    var ftzV = t.ftz[r.key];
    var eoRub = (+eoV) ? eoV * RATES[r.key] : null;
    var ftzRub = (+ftzV) ? ftzV * RATES[r.key] : null;
    var d = diffPct(+eoV || null, +ftzV || null);

    rows += '<tr>' +
      '<td class="rolecell"><b>' + r.name + '</b><span class="rate-note">' + RATES[r.key].toLocaleString('ru-RU') + ' ₽/ч-д</span></td>' +
      '<td class="num">' + (e ? numC('eo.' + r.key, eoV, 0.5) : fmtNum(eoV)) + '</td>' +
      '<td class="num" title="Тянется из внешней БД (Jira)">' + fmtNum(ftzV) + '</td>' +
      '<td class="num" data-costrow="' + r.key + '">' + (eoRub ? fmtMoney(eoRub) : '—') + '</td>' +
      '<td class="num" data-ftzrow="' + r.key + '">' + (ftzRub ? fmtMoney(ftzRub) : '—') + '</td>' +
      '<td class="num"><span class="diff ' + d.cls + '" data-diffrow="' + r.key + '">' + d.txt + '</span></td>' +
      '</tr>';
  });

  var eoSum = calcSum(t.eo);
  var ftzSum = calcSum(t.ftz);
  var dt = diffPct(eoSum,ftzSum);

  return '<table class="tbl">' +
    '<colgroup>' +
    '<col style="width:30%">' +
    '<col style="width:12%">' +
    '<col style="width:12%">' +
    '<col style="width:17%">' +
    '<col style="width:17%">' +
    '<col style="width:12%">' +
    '</colgroup>' +
    '<thead><tr>' +
    '<th>Компетенция</th>' +
    '<th class="num">ЭО, ч/д</th>' +
    '<th class="num">ФТЗ, ч/д</th>' +
    '<th class="num">ЭО, ₽</th>' +
    '<th class="num">ФТЗ, ₽</th>' +
    '<th class="num">Разница</th>' +
    '</tr></thead><tbody>' + rows + '</tbody>' +
    '<tfoot><tr>' +
    '<td>Итого</td>' +
    '<td class="num">' + fmtNum(eoSum) + '</td>' +
    '<td class="num">' + fmtNum(ftzSum) + '</td>' +
    '<td class="num"><span data-dyn="costTotal">' + fmtMoney(calcCost(t.eo)) + '</span></td>' +
    '<td class="num"><span data-dyn="fcostTotal">' + fmtMoney(calcCost(t.ftz)) + '</span></td>' +
    '<td class="num"><span class="diff ' + dt.cls + '" data-dyn="diffTotal">' + dt.txt + '</span></td>' +
    '</tr></tfoot></table>';
}

function refreshDynamic(){
  var t = cur();
  var cost = calcCost(t.eo);
  var fcost = calcCost(t.ftz);
  var ftzT = calcSum(t.ftz);
  var eoSum = calcSum(t.eo);
  var cvE = cvCalc(cost,t.finEffect);
  var cvF = cvCalc(fcost,t.finEffect);

  function set(id,fn){
    var el = document.getElementById(id);
    if(el){
      try{ fn(el); }catch(e){}
    }
  }

  set('headerTitle', function(el){
    el.textContent = t.title;
    el.title = t.title;
  });
  set('hStatus', function(el){ el.textContent = t.status; el.className = 'pill status ' + statusCls(t.status); });
  set('hPrio', function(el){ el.textContent = t.priority; el.className = 'pill priority ' + prioCls(t.priority); });
  set('titleCount', function(el){ el.textContent = (255 - String(t.title || '').length); });
  set('clExec', function(el){ el.style.borderLeftColor = statusHex(t.status); });
  set('custAva', function(el){ el.textContent = initials(t.customer); });
  set('custDept', function(el){ el.textContent = DICT.customerDept[t.customer] || '—'; });
  set('ps', function(el){ el.textContent = (t.priorityScore == null ? '—' : t.priorityScore); el.className = psCls(t.priorityScore); });
  set('psBar', function(el){ el.style.width = (t.priorityScore || 0) + '%'; });

  document.querySelectorAll('[data-dyn]').forEach(function(el){
    var k = el.dataset.dyn;

    try{
      if(k === 'eo') el.textContent = fmtNum(eoSum);
      else if(k === 'cost') el.textContent = fmtMoney(cost);
      else if(k === 'fcost') el.textContent = fmtMoney(fcost);
      else if(k === 'ftz') el.textContent = fmtNum(ftzT);
      else if(k === 'fin') el.textContent = fmtNum(t.finEffect,2);
      else if(k === 'cvE'){
        el.textContent = (cvE == null ? '—' : cvE.toLocaleString('ru-RU'));
        el.className = cvCls(cvE);
      }
      else if(k === 'cvF'){
        el.textContent = (cvF == null ? '—' : cvF.toLocaleString('ru-RU'));
        el.className = cvCls(cvF);
      }
      else if(k === 'costTotal') el.textContent = fmtMoney(cost);
      else if(k === 'fcostTotal') el.textContent = fmtMoney(fcost);
      else if(k === 'diffTotal'){
        var d = diffPct(eoSum,ftzSum);
        el.textContent = d.txt;
        el.className = 'diff ' + d.cls;
      }
    }catch(e){}
  });

  document.querySelectorAll('[data-costrow]').forEach(function(el){
    try{
      var v = +t.eo[el.dataset.costrow] || 0;
      el.textContent = v ? fmtMoney(v * RATES[el.dataset.costrow]) : '—';
    }catch(e){}
  });

  document.querySelectorAll('[data-ftzrow]').forEach(function(el){
    try{
      var v = +t.ftz[el.dataset.ftzrow] || 0;
      el.textContent = v ? fmtMoney(v * RATES[el.dataset.ftzrow]) : '—';
    }catch(e){}
  });

  document.querySelectorAll('[data-diffrow]').forEach(function(el){
    try{
      var d = diffPct(+t.eo[el.dataset.diffrow] || null, +t.ftz[el.dataset.diffrow] || null);
      el.textContent = d.txt;
      el.className = 'diff ' + d.cls;
    }catch(e){}
  });
}

function applyAI(){
  if(!aiSugg) return;

  var t = state.editing ? state.draft : task;
  var oldFin = t.finEffect;

  t.finEffect = aiSugg.fin;
  t.finJust = aiSugg.text;

  if(!state.editing){
    var now = nowLocal();
    t.updatedAt = now;
    t.history.unshift({at:now, by:CURRENT_USER, field:'Финансовый эффект', old:pretty(oldFin), nw:pretty(t.finEffect)});
    t.history.unshift({at:now, by:CURRENT_USER, field:'Обоснование расчёта', old:'AI-расчет', nw:'применено'});
  }

  aiSugg = null;

  if(state.editing) state.dirty = true;

  renderBody();
  refreshDynamic();
  renderFooter();
  updateDirty();
  toast('AI-рекомендация применена','ok');
}

function applyPS(){
  if(!psSugg) return;

  var t = state.editing ? state.draft : task;
  var old = t.priorityScore;

  t.priorityScore = psSugg.score;
  t.priorityJust = psSugg.text;

  if(!state.editing){
    var now = nowLocal();
    t.updatedAt = now;
    t.history.unshift({at:now, by:CURRENT_USER, field:'Priority Score', old:pretty(old), nw:pretty(t.priorityScore)});
  }

  psSugg = null;

  if(state.editing) state.dirty = true;

  renderBody();
  refreshDynamic();
  renderFooter();
  updateDirty();
  toast('Priority Score обновлён','ok');
}

var mentionTarget = null;

function hidePops(){
  document.querySelectorAll('.mpop').forEach(function(p){
    p.classList.remove('show');
  });
}

function onMentionInput(ta){
  mentionTarget = ta;

  var pos = ta.selectionStart || 0;
  var m = ta.value.slice(0,pos).match(/@([^\s@]*)$/);
  var pop = document.getElementById('mpop-' + ta.id);

  if(!m || !pop){
    hidePops();
    return;
  }

  var list = DICT.users.filter(function(u){
    return u.toLowerCase().indexOf(m[1].toLowerCase()) >= 0;
  });

  if(!list.length){
    hidePops();
    return;
  }

  pop.innerHTML = list.map(function(u){
    return '<button type="button" data-action="mention" data-name="' + esc(u) + '">' +
      '<span class="cava">' + initials(u) + '</span>' + esc(personDisp(u)) + '</button>';
  }).join('');

  pop.classList.add('show');
}

function applyMention(name){
  var ta = mentionTarget;
  if(!ta) return;

  var pos = ta.selectionStart || 0;
  var before = ta.value.slice(0,pos).replace(/@([^\s@]*)$/,'@' + name + ' ');

  ta.value = before + ta.value.slice(pos);

  var np = before.length;
  ta.focus();
  ta.setSelectionRange(np,np);

  hidePops();
}

  aiSugg = null;
  psSugg = null;
  render();
  toast('Изменения отменены','warn');
}

function validate(d){
  if(!String(d.title || '').trim()) return 'Укажите название задачи — поле обязательно';
  if(d.mockupUrl && !urlOk(d.mockupUrl)) return 'Некорректная ссылка на макеты (ожидается http(s)://…)';
  return null;
}

function saveEdit(){
  var err = validate(state.draft);

  if(err){
    if(state.tab !== 'main'){
      state.tab = 'main';
      renderBody();
    }

    toast(err,'err');

    var ti = document.querySelector('[data-k="title"]');
    if(ti) ti.focus();

    return;
  }

  var btn = $('#saveBtn');
  if(btn) btn.classList.add('loading');

  setTimeout(function(){
    var ch = diffChanges(task,state.draft);
    var now = nowLocal();

    ch.forEach(function(c){
      state.draft.history.unshift({at:now, by:CURRENT_USER, field:c.field, old:c.old, nw:c.nw});
    });

    state.draft.updatedAt = now;
    task = state.draft;

    state.editing = false;
    state.draft = null;
    state.dirty = false;
    state.replyFor = null;
    aiSugg = null;
    psSugg = null;

    render();

    toast(ch.length ? ('Сохранено · изменений: ' + ch.length) : 'Сохранено · без изменений','ok');
  },380);
}

function pretty(v){
  if(Array.isArray(v)) return v.join(', ') || '—';
  if(v === null || v === '') return '—';
  if(typeof v === 'boolean') return v ? 'да' : 'нет';
  return String(v);
}

function diffChanges(a,b){
  var ch = [];

  var TRACK = [
    ['title','Название задачи'],
    ['description','Описание задачи'],
    ['receivedAt','Дата получения'],
    ['channel','Канал поступления'],
    ['customer','Бизнес-заказчик'],
    ['project','Проект'],
    ['type','Тип задачи'],
    ['priority','Приоритет'],
    ['status','Статус задачи'],
    ['deadline','Срок выполнения'],
    ['team','Ответственная команда'],
    ['assignee','Исполнитель'],
    ['progress','Прогресс'],
    ['finEffect','Финансовый эффект'],
    ['finJust','Обоснование фин. эффекта'],
    ['priorityScore','Priority Score'],
    ['priorityJust','Обоснование Priority Score'],
    ['mockupUrl','Ссылка на макеты'],
    ['prevDirStatus','Статус предыдущей встречи (директорская)'],
    ['dirStatus','Статус для Директорской оперативки'],
    ['dirStatusAt','Дата изменения статуса (директорская)'],
    ['prevDidStatus','Статус предыдущей встречи (ДИД)'],
    ['didStatus','Статус для оперативки ДИД'],
    ['didStatusAt','Дата изменения статуса ДИД'],
    ['demoDid','Демо для ДИД'],
    ['prevKeyStatus','Статус предыдущей встречи (ключ. проекты)'],
    ['keyStatus','Статус для встречи по ключевым проектам'],
    ['keyStatusAt','Дата изменения статуса ключ. проекта'],
    ['tags','Метки (теги)'],
    ['otherTeams','Другие вовлечённые команды'],
    ['jiraLinks','Ссылки на Jira'],
    ['reqLinks','Ссылки на бизнес-требования']
  ];

  TRACK.forEach(function(p){
    if(JSON.stringify(a[p[0]]) !== JSON.stringify(b[p[0]])){
      ch.push({field:p[1], old:pretty(a[p[0]]), nw:pretty(b[p[0]])});
    }
  });

  ROLES.forEach(function(r){
    if(+a.eo[r.key] !== +b.eo[r.key]){
      ch.push({field:r.name + ' (ЭО)', old:pretty(a.eo[r.key]), nw:pretty(b.eo[r.key])});
    }
  });

  return ch;
}

function setPath(o,p,v){
  var parts = p.split('.');
  var x = o;

  for(var i=0; i<parts.length-1; i++){
    x = x[parts[i]];
  }

  x[parts[parts.length-1]] = v;
}

function onField(ev){
  if(ev.target.dataset && ev.target.dataset.mention){
    onMentionInput(ev.target);
    return;
  }

  var k = ev.target.dataset ? ev.target.dataset.k : null;
  if(!k || !state.editing) return;

  var v = ev.target.value;

  if(ev.target.type === 'checkbox'){
    v = ev.target.checked;
  }else if(ev.target.type === 'number' || ev.target.type === 'range'){
    v = v === '' ? null : Math.max(0,+v);
    if(k === 'progress') v = Math.min(100, Math.round(v));
  }

  try{
    setPath(state.draft,k,v);
  }catch(e){}

  state.dirty = true;
  updateDirty();

  if(k === 'title'){
    refreshDynamic();
  }

  if(k === 'progress'){
    document.querySelectorAll('[data-k="progress"]').forEach(function(el){
      if(el !== ev.target) el.value = v;
    });
  }

  if(k === 'demoDid') renderBody();

  refreshDynamic();
}

document.addEventListener('input', onField);
document.addEventListener('change', onField);

document.addEventListener('change', function(ev){
  var addField = ev.target.dataset && ev.target.dataset.addField;

  if(addField && state.editing){
    var val = ev.target.value;

    if(val){
      var arr = state.draft[addField];

      if(arr && arr.indexOf(val) < 0){
        arr.push(val);
        state.dirty = true;
        renderBody();
        updateDirty();
        refreshDynamic();
      }
    }
  }
});

document.addEventListener('click', function(ev){
  if(!ev.target.closest('.mpop') && !ev.target.closest('textarea[data-mention]')){
    hidePops();
  }

  var act = ev.target.closest('[data-action]');

  if(act){
    var a = act.dataset.action;

    try{
      if(a === 'edit') startEdit();
      else if(a === 'save') saveEdit();
      else if(a === 'cancel') cancelEdit();
      else if(a === 'close') closeModal();
      else if(a === 'copy-id'){
        try{
          navigator.clipboard.writeText(String(task.id));
          toast('ID ' + task.id + ' скопирован','ok');
        }catch(e){
          toast('ID: ' + task.id,'ok');
        }
      }
      else if(a === 'mention') applyMention(act.dataset.name);
      else if(a === 'ai-calc'){
        aiSugg = aiSuggest();
        var pop = document.getElementById('aiPop');

        if(pop){
          pop.innerHTML = '<div class="ah">' + ic('spark') + 'AI-подсказка</div>' +
            '<div class="av">Финансовый эффект: ' + fmtNum(aiSugg.fin,1) + ' млн ₽</div>' +
            '<div class="at">' + esc(aiSugg.text) + '</div>' +
            '<div style="display:flex;gap:8px">' +
            '<button class="btn primary mini" data-action="ai-apply">' + ic('check') + 'Применить</button>' +
            '<button class="btn ghost mini" data-action="ai-dismiss">Скрыть</button>' +
            '</div>';

          pop.classList.add('show');
        }
      }
      else if(a === 'ai-apply') applyAI();
      else if(a === 'ai-dismiss'){
        aiSugg = null;
        var p1 = document.getElementById('aiPop');
        if(p1) p1.classList.remove('show');
      }
      else if(a === 'ps-calc'){
        psSugg = psSuggest();
        var pop2 = document.getElementById('psPop');

        if(pop2){
          pop2.innerHTML = '<div class="ah">' + ic('spark') + 'Расчёт агента</div>' +
            '<div class="av">Priority Score: ' + psSugg.score + '/100</div>' +
            '<div class="at">' + esc(psSugg.text) + '</div>' +
            '<div style="display:flex;gap:8px">' +
            '<button class="btn primary mini" data-action="ps-apply">' + ic('check') + 'Применить</button>' +
            '<button class="btn ghost mini" data-action="ps-dismiss">Скрыть</button>' +
            '</div>';

          pop2.classList.add('show');
        }
      }
      else if(a === 'ps-apply') applyPS();
      else if(a === 'ps-dismiss'){
        psSugg = null;
        var p2 = document.getElementById('psPop');
        if(p2) p2.classList.remove('show');
      }
      else if(a === 'reply'){
        state.replyFor = +act.dataset.cid;
        renderBody();
      }
      else if(a === 'reply-cancel'){
        state.replyFor = null;
        renderBody();
      }
      else if(a === 'send-comment'){
        var box = document.getElementById('commentBox');

        if(box && box.value.trim()){
          task.comments.push({
            id:Date.now(),
            author:CURRENT_USER,
            at:nowLocal(),
            text:box.value.trim(),
            replies:[]
          });

          renderBody();
          renderTabs();
          toast('Комментарий добавлен','ok');
        }else{
          toast('Комментарий пуст','err');
        }
      }
      else if(a === 'send-reply'){
        var box2 = document.getElementById('replyBox');
        var c = task.comments.find(function(x){ return x.id === +act.dataset.cid; });

        if(box2 && box2.value.trim() && c){
          c.replies.push({
            id:Date.now(),
            author:CURRENT_USER,
            at:nowLocal(),
            text:box2.value.trim()
          });

          state.replyFor = null;

          renderBody();
          renderTabs();
          toast('Ответ добавлен','ok');
        }else{
          toast('Ответ пуст','err');
        }
      }
      else if(a === 'add-jira'){
        var inp = document.getElementById('newJira');

        if(inp && inp.value.trim()){
          if(!urlOk(inp.value.trim())){
            toast('Некорректная ссылка Jira','err');
            return;
          }

          state.draft.jiraLinks.push(inp.value.trim());
          state.dirty = true;
          renderBody();
          updateDirty();
        }
      }
      else if(a === 'del-jira'){
        state.draft.jiraLinks.splice(+act.dataset.idx,1);
        state.dirty = true;
        renderBody();
        updateDirty();
      }
      else if(a === 'add-req'){
        var inp2 = document.getElementById('newReq');

        if(inp2 && inp2.value.trim()){
          if(!urlOk(inp2.value.trim())){
            toast('Некорректная ссылка на требования','err');
            return;
          }

          state.draft.reqLinks.push(inp2.value.trim());
          state.dirty = true;
          renderBody();
          updateDirty();
        }
      }
      else if(a === 'del-req'){
        state.draft.reqLinks.splice(+act.dataset.idx,1);
        state.dirty = true;
        renderBody();
        updateDirty();
      }
    }catch(err){
      console.error('Action error:', err);
      toast('Ошибка: ' + err.message,'err');
    }

    return;
  }

  var tab = ev.target.closest('[data-tab]');

  if(tab){
    state.tab = tab.dataset.tab;
    state.replyFor = null;
    renderTabs();
    renderBody();
    return;
  }

  var chip = ev.target.closest('[data-toggle]');

  if(chip && state.editing){
    var field = chip.dataset.toggle;
    var val = chip.dataset.val;
    var arr = state.draft[field];
    var i = arr.indexOf(val);

    if(i >= 0) arr.splice(i,1);
    else arr.push(val);

    state.dirty = true;

    renderBody();
    updateDirty();
    refreshDynamic();

    return;
  }
});

document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){
    hidePops();

    if(state.editing) cancelEdit();
    else closeModal();

    return;
  }

  if((e.ctrlKey || e.metaKey) && e.key === 'Enter' && state.editing){
    e.preventDefault();
    saveEdit();
    return;
  }

  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'e' && !state.editing){
    var tag = document.activeElement && document.activeElement.tagName;

    if(tag !== 'INPUT' && tag !== 'TEXTAREA' && tag !== 'SELECT'){
      e.preventDefault();
      startEdit();
      return;
    }
  }
});

$('#overlay').addEventListener('mousedown', function(e){
  if(e.target.id === 'overlay') closeModal();
});

function closeModal(){
  if(state.dirty || state.editing){
    if(confirm('У вас есть несохранённые изменения. Закрыть без сохранения?')){
      cancelEdit();
      $('#overlay').classList.add('hidden');
    }
    return;
  }

  $('#overlay').classList.add('hidden');
}

var toastT;

function toast(msg,type){
  var t = $('#toast');

  type = type || 'ok';
  t.className = 'toast show ' + (type !== 'ok' ? type : '');

  var icon = type === 'err' ? 'alert' : (type === 'warn' ? 'alert' : 'check');

  t.innerHTML = ic(icon) + '<span>' + esc(msg) + '</span>';

  clearTimeout(toastT);

  toastT = setTimeout(function(){
    t.classList.remove('show');
  },2800);
}

try{
  render();
}catch(err){
  console.error('Render error:', err);

  var mb = document.getElementById('mbody');

  if(mb){
    mb.innerHTML = '<div class="errbox">Ошибка рендера: ' + esc(err.message) + '</div>';
  }
}
</script>
</body>
</html>
