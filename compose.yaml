name: dmb-platform

services:
  postgres:
    image: postgres:16-alpine@sha256:075f7ba66bc9b3ce7d6b8b635208ff61cd7cf1a67d71ec530eec5d7ae0cbe571
    environment:
      POSTGRES_DB: dmb_backlog
      POSTGRES_USER: dmb
      POSTGRES_PASSWORD: dmb_local_dev
    ports:
      - "5432:5432"
    volumes:
      - dmb-postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dmb -d dmb_backlog"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine@sha256:1db42ccef14898aa29bae778452d567534b59c107129cbc1163fb552de184d3c
    ports:
      - "6379:6379"
    volumes:
      - dmb-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  dmb-postgres-data:
  dmb-redis-data:
