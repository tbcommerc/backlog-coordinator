name: dmb-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dmb_backlog
      POSTGRES_USER: dmb
      POSTGRES_PASSWORD: dmb_local_dev
    ports:
      - "5432:5432"
    volumes:
      - dmb-postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dmb -d dmb_backlog"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - dmb-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  dmb-postgres-data:
  dmb-redis-data:
